sible}svg{min-width:0;width:100%}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"app\">\n<header>\n  <div><h1>Croqui interativo — Serra-copo<\/h1><p>V3: cotas acumuladas revisadas, precisão consistente e bloqueio de cotas quando o projeto não cabe.<\/p><\/div>\n  <div class=\"actions\"><button class=\"btn\" id=\"printBtn\">Imprimir / PDF<\/button><button class=\"btn\" id=\"csvBtn\">Exportar CSV<\/button><button class=\"btn primary\" id=\"resetBtn\">Restaurar exemplo<\/button><\/div>\n<\/header>\n<nav class=\"mobile-tabs\" aria-label=\"Navegação mobile\">\n  <button class=\"mobile-tab active\" type=\"button\" data-tab=\"config\">Configurar<\/button>\n  <button class=\"mobile-tab\" type=\"button\" data-tab=\"ordem\">Ordem<\/button>\n  <button class=\"mobile-tab\" type=\"button\" data-tab=\"croqui\">Croqui<\/button>\n<\/nav>\n<div class=\"layout\">\n  <aside class=\"panel controls\">\n    <div class=\"section config-section\">\n      <h2>1. Chapa<\/h2>\n      <div class=\"grid2\">\n        <div class=\"field\"><label for=\"boardW\">Comprimento (mm)<\/label><input id=\"boardW\" type=\"number\" min=\"1\" step=\"1\" value=\"1900\"><\/div>\n        <div class=\"field\"><label for=\"boardH\">Altura final (mm)<\/label><input id=\"boardH\" type=\"number\" min=\"1\" step=\"1\" value=\"130\"><\/div>\n        <div class=\"field\"><label for=\"edgeReserve\">Reserva em cada extremidade (mm)<\/label><input id=\"edgeReserve\" type=\"number\" min=\"0\" step=\"0.1\" value=\"50\"><\/div>\n      <\/div>\n      <small class=\"hint\">A reserva é aplicada igualmente à esquerda e à direita. Todos os vãos entre as circunferências são recalculados automaticamente dentro do comprimento útil restante.<\/small>\n    <\/div>\n\n    <div class=\"section config-section\">\n      <h2>2. Serras-copo — até 10 tamanhos<\/h2>\n      <div id=\"diameters\" class=\"diams\"><\/div>\n      <div class=\"row-actions\"><button class=\"btn\" id=\"addDiameter\">+ Adicionar diâmetro<\/button><\/div>\n      <small class=\"hint\">Os botões abaixo inserem o diâmetro correspondente no fim da sequência.<\/small>\n      <div id=\"toolButtons\" class=\"tool-buttons\"><\/div>\n    <\/div>\n\n    <div class=\"section sequence-section\">\n      <h2>3. Ordem dos diâmetros<\/h2>\n      <div id=\"sequence\" class=\"sequence\" aria-live=\"polite\"><\/div>\n      <div class=\"row-actions\"><button class=\"btn\" id=\"clearSeq\">Limpar sequência<\/button><button class=\"btn\" id=\"exampleSeq\">Exemplo 5×100 + 10×60<\/button><\/div>\n      <small class=\"hint\">Use ◀ ▶ para mover cada furo e × para remover. Também é possível inserir quantos furos couberem no projeto.<\/small>\n    <\/div>\n\n    <div class=\"section config-section\">\n      <h2>4. Distribuição horizontal<\/h2>\n      <div class=\"field\">\n        <label for=\"fitRule\">Regra de distribuição dos vãos<\/label>\n        <select id=\"fitRule\"><option value=\"equal\">Vãos iguais entre todas as circunferências<\/option><option value=\"proportional\">Vãos proporcionais ao diâmetro médio dos vizinhos<\/option><\/select>\n      <\/div>\n      <small class=\"hint\">A aplicação sempre usa: comprimento da chapa − reservas das duas extremidades − soma dos diâmetros. O espaço restante é distribuído entre todos os vãos.<\/small>\n    <\/div>\n\n    <div class=\"section config-section\">\n      <h2>5. Profundidade do recorte<\/h2>\n      <div class=\"field\"><label for=\"percent\">Circunferência dentro da chapa (%)<\/label><input id=\"percent\" type=\"number\" min=\"50\" max=\"99.9\" step=\"0.1\" value=\"70\"><\/div>\n      <small class=\"hint\">50% = exatamente meia circunferência. Para 60%, 65% e 70%, o centro sobe progressivamente em relação à borda inferior.<\/small>\n    <\/div>\n\n    <div class=\"section config-section\">\n      <h2>6. Exibição do croqui<\/h2>\n      <label class=\"radio-line\" style=\"gap:8px\"><input id=\"showAccum\" type=\"checkbox\" checked style=\"width:auto;min-height:auto\"> Mostrar cotas acumuladas da borda esquerda até o centro de cada circunferência<\/label>\n      <small class=\"hint\">As cotas X acumuladas são calculadas com precisão completa e exibidas com 2 casas decimais. Os vãos do croqui usam 3 casas para reduzir diferenças por arredondamento.<\/small>\n    <\/div>\n\n    <div id=\"status\" class=\"status\"><\/div>\n  <\/aside>\n\n  <main class=\"panel viewer\">\n    <h2>Croqui cotado<\/h2>\n    <div class=\"svg-wrap\"><svg id=\"drawing\" viewBox=\"0 0 1400 760\" role=\"img\" aria-label=\"Croqui cotado da chapa com recortes de serra-copo\"><\/svg><\/div>\n    <div class=\"legend\"><span><i class=\"sw\" style=\"background:#253746\"><\/i>chapa<\/span><span><i class=\"sw\" style=\"background:#21a9d6\"><\/i>cotas e centros<\/span><span><i class=\"sw\" style=\"background:#fff;border:1px solid #aaa\"><\/i>material removido<\/span><\/div>\n    <div class=\"metrics\">\n      <div class=\"metric\"><span>Comprimento mínimo<\/span><strong id=\"mRequired\">—<\/strong><\/div>\n      <div class=\"metric\"><span>Vão calculado<\/span><strong id=\"mGap\">—<\/strong><\/div>\n      <div class=\"metric\"><span>Maior abertura na borda<\/span><strong id=\"mOpening\">—<\/strong><\/div>\n      <div class=\"metric\"><span>Maior Y do centro<\/span><strong id=\"mY\">—<\/strong><\/div>\n    <\/div>\n    <div class=\"table-wrap\"><table><thead><tr><th>Nº<\/th><th>Ø (mm)<\/th><th>X centro (mm)<\/th><th>Y centro (mm)<\/th><th>Abertura na borda (mm)<\/th><th>Arco interno<\/th><th>Vão anterior (mm)<\/th><\/tr><\/thead><tbody id=\"tbody\"><\/tbody><\/table><\/div>\n  <\/main>\n<\/div>\n<\/div>\n<script>\n(() => {\n'use strict';\nconst $ = s => document.querySelector(s);\nconst $$ = s => [...document.querySelectorAll(s)];\nconst els = {\n  boardW:$('#boardW'), boardH:$('#boardH'), edgeReserve:$('#edgeReserve'), diameters:$('#diameters'), toolButtons:$('#toolButtons'), sequence:$('#sequence'),\n  fitRule:$('#fitRule'),\n  percent:$('#percent'), showAccum:$('#showAccum'), status:$('#status'), drawing:$('#drawing'), tbody:$('#tbody'), mRequired:$('#mRequired'), mGap:$('#mGap'), mOpening:$('#mOpening'), mY:$('#mY')\n};\nlet tools = [60,100];\nlet seq = [60,100,60,60,100,60,60,100,60,60,100,60,60,100,60];\nconst clamp=(v,a,b)=>Math.min(b,Math.max(a,v));\nconst num=(el,fallback=0)=>{const v=Number(el.value);return Number.isFinite(v)?v:fallback};\nconst fmt=(v,d=2)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});\nconst esc=s=>String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;'}[m]));\nfunction toolColor(i){return ['#31566f','#476b5f','#6b5d3c','#6a4c63','#3e6468','#665348','#4e5c78','#5c6c42','#6b4f4f','#4d6170'][i%10]}\nfunction renderTools(){\n  els.diameters.innerHTML='';\n  tools.forEach((d,i)=>{\n    const row=document.createElement('div'); row.className='diam-row';\n    row.innerHTML=`<input aria-label=\"Diâmetro ${i+1}\" type=\"number\" min=\"1\" max=\"1000\" step=\"0.1\" value=\"${d}\"><button class=\"icon-btn\" type=\"button\" title=\"Remover diâmetro\">×<\/button>`;\n    const inp=row.querySelector('input'); inp.addEventListener('change',()=>{const old=tools[i]; const nv=clamp(Number(inp.value)||old,1,1000); tools[i]=nv; seq=seq.map(x=>Math.abs(x-old)<1e-9?nv:x); renderTools(); renderSequence(); update();});\n    row.querySelector('button').addEventListener('click',()=>{if(tools.length<=1)return; const old=tools[i]; tools.splice(i,1); seq=seq.filter(x=>Math.abs(x-old)>1e-9); renderTools(); renderSequence(); update();});\n    els.diameters.appendChild(row);\n  });\n  els.toolButtons.innerHTML='';\n  tools.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='tool-chip';b.innerHTML=`+ Ø <strong>${fmt(d,1).replace(',0','')}<\/strong>`;b.style.borderColor=toolColor(i);b.addEventListener('click',()=>{if(seq.length<100){seq.push(d);renderSequence();update();}});els.toolButtons.appendChild(b)});\n  $('#addDiameter').disabled=tools.length>=10;\n}\nfunction renderSequence(){\n  els.sequence.innerHTML='';\n  if(!seq.length){els.sequence.innerHTML='<span style=\"color:var(--muted)\">Nenhum furo. Adicione um diâmetro acima.<\/span>';return}\n  seq.forEach((d,i)=>{\n    const item=document.createElement('span'); item.className='seq-item';\n    const ti=Math.max(0,tools.findIndex(x=>Math.abs(x-d)<1e-9)); item.style.borderColor=toolColor(ti);\n    item.innerHTML=`<span class=\"n\">${String(i+1).padStart(2,'0')}<\/span><strong>Ø${fmt(d,1).replace(',0','')}<\/strong><button type=\"button\" aria-label=\"Mover para esquerda\">◀<\/button><button type=\"button\" aria-label=\"Mover para direita\">▶<\/button><button type=\"button\" aria-label=\"Remover\">×<\/button>`;\n    const bs=item.querySelectorAll('button');\n    bs[0].addEventListener('click',()=>{if(i>0){[seq[i-1],seq[i]]=[seq[i],seq[i-1]];renderSequence();update();}});\n    bs[1].addEventListener('click',()=>{if(i<seq.length-1){[seq[i+1],seq[i]]=[seq[i],seq[i+1]];renderSequence();update();}});\n    bs[2].addEventListener('click',()=>{seq.splice(i,1);renderSequence();update();});\n    els.sequence.appendChild(item);\n  });\n}\nfunction calc(){\n  const W=Math.max(1,num(els.boardW,1900)), H=Math.max(1,num(els.boardH,130));\n  const reserve=Math.max(0,num(els.edgeReserve,50));\n  const p=clamp(num(els.percent,70),50,99.9)/100;\n  els.percent.value=(p*100).toFixed(1).replace('.0','');\n  const n=seq.length;\n  const radii=seq.map(d=>d/2);\n  let gaps=[], leftMargin=reserve, rightMargin=reserve, required=0, fit=true, message='';\n  if(!n) return {W,H,p,n,items:[],gaps:[],leftMargin,reserve,rightMargin,required:2*reserve,fit:true,message:'Adicione ao menos um furo.'};\n  const sumD=seq.reduce((a,b)=>a+b,0);\n  required=sumD+leftMargin+rightMargin;\n  const free=W-required;\n  if(free<0){\n    gaps=Array(Math.max(0,n-1)).fill(0);\n    fit=false;\n    message=`NÃO CABE: diâmetros + reservas excedem a chapa em ${fmt(-free)} mm. Comprimento mínimo: ${fmt(required)} mm. As cotas X são bloqueadas para fabricação até o projeto ficar válido.`;\n  }else if(n===1){\n    gaps=[];\n    message=`Furo único centralizado na área útil. Reserva de ${fmt(reserve)} mm em cada extremidade.`;\n  }else if(els.fitRule.value==='equal'){\n    const g=free/(n-1);\n    gaps=Array(n-1).fill(g);\n    message=`Vãos iguais calculados automaticamente: ${fmt(g)} mm. Reserva: ${fmt(reserve)} mm em cada extremidade.`;\n  }else{\n    const weights=[];\n    for(let i=0;i<n-1;i++) weights.push((seq[i]+seq[i+1])/2);\n    const sw=weights.reduce((a,b)=>a+b,0)||1;\n    gaps=weights.map(w=>free*w/sw);\n    message=`Vãos distribuídos proporcionalmente, respeitando ${fmt(reserve)} mm de reserva em cada extremidade.`;\n  }\n  let x;\n  if(n===1 && fit){\n    x=W/2;\n  }else{\n    x=leftMargin+radii[0];\n  }\n  const alpha=Math.PI*(p-.5);\n  const items=[];\n  for(let i=0;i<n;i++){\n    if(i>0)x += radii[i-1]+gaps[i-1]+radii[i];\n    const r=radii[i], y=r*Math.sin(alpha), opening=2*r*Math.cos(alpha);\n    items.push({i,d:seq[i],r,x,y,opening,arc:p*360,gapBefore:i?gaps[i-1]:null});\n  }\n  return {W,H,p,n,items,gaps,leftMargin,reserve,rightMargin,required,fit,message};\n}\nfunction svgEl(tag,attrs={},text=''){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}\nfunction draw(c){\n  const s=els.drawing; s.replaceChildren();\n  const showAccum=!!els.showAccum.checked;\n  const VBW=1400, VBH=showAccum?900:760, padL=90,padR=50, boardTop=190, boardPixH=230, boardBottom=boardTop+boardPixH;\n  s.setAttribute('viewBox',`0 0 ${VBW} ${VBH}`);\n  const scale=(VBW-padL-padR)/Math.max(c.W,1);\n  const yScale=Math.min(scale, boardPixH/Math.max(c.H,1));\n  const bw=c.W*scale, bh=c.H*yScale;\n  const bx=padL, by=boardBottom-bh;\n  const defs=svgEl('defs');\n  const marker=svgEl('marker',{id:'arr',markerWidth:'8',markerHeight:'8',refX:'4',refY:'4',orient:'auto',markerUnits:'strokeWidth'}); marker.appendChild(svgEl('path',{d:'M8,4 L0,0 L0,8 Z',fill:'#21a9d6'})); defs.appendChild(marker);s.appendChild(defs);\n  s.appendChild(svgEl('text',{x:bx,y:45,fill:'#172737','font-size':'28','font-weight':'800'},'CROQUI DE MARCENARIA | RECORTES COM SERRA-COPO'));\n  s.appendChild(svgEl('text',{x:bx,y:76,fill:'#526575','font-size':'16'},`${c.n} furos • ${fmt(c.p*100,1)}% da circunferência dentro da chapa • distribuição automática • reserva ${fmt(c.reserve,1)} mm/lado`));\n  if(!c.fit){\n    s.appendChild(svgEl('rect',{x:bx,y:88,width:bw,height:28,rx:'5',fill:'#ffe3e3',stroke:'#c43f3f','stroke-width':'1.2'}));\n    s.appendChild(svgEl('text',{x:bx+bw/2,y:107,fill:'#9f2424','font-size':'13','font-weight':'800','text-anchor':'middle'},'PROJETO INVÁLIDO — NÃO CABE NA CHAPA. COTAS X BLOQUEADAS PARA FABRICAÇÃO.'));\n  }\n  // top dimension\n  const dimY=120; s.appendChild(svgEl('line',{x1:bx,y1:dimY,x2:bx+bw,y2:dimY,stroke:'#21a9d6','stroke-width':'2','marker-start':'url(#arr)','marker-end':'url(#arr)'}));\n  s.appendChild(svgEl('line',{x1:bx,y1:dimY-10,x2:bx,y2:by,stroke:'#21a9d6','stroke-width':'1'}));s.appendChild(svgEl('line',{x1:bx+bw,y1:dimY-10,x2:bx+bw,y2:by,stroke:'#21a9d6','stroke-width':'1'}));\n  s.appendChild(svgEl('text',{x:bx+bw/2,y:dimY-10,fill:'#1289b0','font-size':'17','font-weight':'800','text-anchor':'middle'},`${fmt(c.W,0)} mm`));\n  // board mask path using arcs; easiest: rectangle and white holes\n  s.appendChild(svgEl('rect',{x:bx,y:by,width:bw,height:bh,fill:'#253746'}));\n  c.items.forEach(it=>{\n    const cx=bx+it.x*scale, cy=boardBottom-it.y*yScale, r=it.r*scale;\n    // circle removal: white circle over board, clipped visually by board rectangle\n    const circ=svgEl('circle',{cx,cy,r,fill:'#fff'});s.appendChild(circ);\n    s.appendChild(svgEl('line',{x1:cx-8,y1:cy,x2:cx+8,y2:cy,stroke:'#21a9d6','stroke-width':'2'}));s.appendChild(svgEl('line',{x1:cx,y1:cy-8,x2:cx,y2:cy+8,stroke:'#21a9d6','stroke-width':'2'}));\n    s.appendChild(svgEl('line',{x1:cx,y1:cy-28,x2:cx,y2:cy+28,stroke:'#21a9d6','stroke-width':'1','stroke-dasharray':'4 4'}));\n    s.appendChild(svgEl('text',{x:cx,y:Math.max(by+18,cy-r-9),fill:'#19a7d1','font-size':'12','font-weight':'700','text-anchor':'middle'},String(it.i+1).padStart(2,'0')));\n    s.appendChild(svgEl('text',{x:cx,y:Math.min(boardBottom-8,cy+24),fill:'#617687','font-size':'12','text-anchor':'middle'},`Ø${fmt(it.d,1).replace(',0','')}`));\n  });\n  // left height dim\n  const hx=bx-40; s.appendChild(svgEl('line',{x1:hx,y1:by,x2:hx,y2:boardBottom,stroke:'#21a9d6','stroke-width':'2','marker-start':'url(#arr)','marker-end':'url(#arr)'}));s.appendChild(svgEl('line',{x1:hx,y1:by,x2:bx,y2:by,stroke:'#21a9d6'}));s.appendChild(svgEl('line',{x1:hx,y1:boardBottom,x2:bx,y2:boardBottom,stroke:'#21a9d6'}));s.appendChild(svgEl('text',{x:hx-8,y:(by+boardBottom)/2+5,fill:'#1289b0','font-size':'14','font-weight':'800','text-anchor':'end'},`${fmt(c.H,0)} mm`));\n  // reservas laterais\n  if(c.items.length){\n    const ry=boardBottom+18;\n    const firstLeft=bx+(c.items[0].x-c.items[0].r)*scale;\n    const lastRight=bx+(c.items[c.items.length-1].x+c.items[c.items.length-1].r)*scale;\n    if(firstLeft-bx>8){\n      s.appendChild(svgEl('line',{x1:bx,y1:ry,x2:firstLeft,y2:ry,stroke:'#6aaec5','stroke-width':'1.2','marker-start':'url(#arr)','marker-end':'url(#arr)'}));\n      s.appendChild(svgEl('text',{x:(bx+firstLeft)/2,y:ry-5,fill:'#557f8f','font-size':'10','text-anchor':'middle'},`R=${fmt(c.leftMargin,2)}`));\n    }\n    if(bx+bw-lastRight>8){\n      s.appendChild(svgEl('line',{x1:lastRight,y1:ry,x2:bx+bw,y2:ry,stroke:'#6aaec5','stroke-width':'1.2','marker-start':'url(#arr)','marker-end':'url(#arr)'}));\n      s.appendChild(svgEl('text',{x:(lastRight+bx+bw)/2,y:ry-5,fill:'#557f8f','font-size':'10','text-anchor':'middle'},`R=${fmt(c.rightMargin,2)}`));\n    }\n  }\n  // horizontal gaps dimension examples (all if enough room)\n  const gapY=boardBottom+42;\n  for(let i=1;i<c.items.length;i++){\n    const a=c.items[i-1],b=c.items[i]; const x1=bx+(a.x+a.r)*scale, x2=bx+(b.x-b.r)*scale;\n    if(x2-x1>18){s.appendChild(svgEl('line',{x1,y1:gapY,x2,y2:gapY,stroke:'#21a9d6','stroke-width':'1.5','marker-start':'url(#arr)','marker-end':'url(#arr)'})); if(i<8||c.items.length<=8)s.appendChild(svgEl('text',{x:(x1+x2)/2,y:gapY-7,fill:'#1289b0','font-size':'10','text-anchor':'middle'},fmt(c.gaps[i-1],3)))}\n  }\n  // accumulated X dimensions from left edge to each center\n  let accumExtra=0;\n  if(showAccum && c.items.length){\n    const levels=4, baseY=boardBottom+78, stepY=24;\n    c.items.forEach((it,i)=>{\n      const cx=bx+it.x*scale, ly=baseY+(i%levels)*stepY;\n      s.appendChild(svgEl('line',{x1:bx,y1:ly,x2:cx,y2:ly,stroke:'#21a9d6','stroke-width':'1','marker-start':'url(#arr)','marker-end':'url(#arr)'}));\n      s.appendChild(svgEl('line',{x1:cx,y1:boardBottom+3,x2:cx,y2:ly+5,stroke:'#8dcfe4','stroke-width':'.8','stroke-dasharray':'3 3'}));\n      s.appendChild(svgEl('text',{x:(bx+cx)/2,y:ly-5,fill:c.fit?'#1289b0':'#c43f3f','font-size':'10','font-weight':'700','text-anchor':'middle'},c.fit?`X${String(i+1).padStart(2,'0')}=${fmt(it.x,2)} mm`:`X${String(i+1).padStart(2,'0')}=INVÁLIDA`));\n    });\n    accumExtra=112;\n  }\n  // bottom info\n  const infoY=boardBottom+95+accumExtra;\n  s.appendChild(svgEl('text',{x:bx,y:infoY,fill:'#172737','font-size':'16','font-weight':'800'},'COORDENADAS DOS CENTROS'));\n  const lines=[\n    `Percentual interno: ${fmt(c.p*100,1)}%  |  Ângulo de arco interno: ${fmt(c.p*360,1)}°`,\n    `Fórmula de Y: (Ø/2) × sen[π × (${fmt(c.p,3)} − 0,5)]`,\n    `Abertura na borda: Ø × cos[π × (${fmt(c.p,3)} − 0,5)]`,\n    `Comprimento mínimo (diâmetros + reservas): ${fmt(c.required)} mm  |  Chapa configurada: ${fmt(c.W)} mm`\n  ];\n  lines.forEach((t,i)=>s.appendChild(svgEl('text',{x:bx,y:infoY+28+i*23,fill:i===3?(c.fit?'#238a53':'#cf4b4b'):'#526575','font-size':'14','font-weight':i===3?'700':'400'},t)));\n  // mini position labels for first 15 if possible\n  const startY=infoY+135; let col=0,row=0; const perCol=8, colW=400;\n  c.items.slice(0,24).forEach((it,i)=>{col=Math.floor(i/perCol);row=i%perCol;const txt=c.fit?`${String(i+1).padStart(2,'0')}  Ø${fmt(it.d,1).replace(',0','')}  X=${fmt(it.x,2)}  Y=${fmt(it.y,2)}`:`${String(i+1).padStart(2,'0')}  Ø${fmt(it.d,1).replace(',0','')}  X=INVÁLIDA  Y=${fmt(it.y,2)}`;s.appendChild(svgEl('text',{x:bx+col*colW,y:startY+row*21,fill:'#314759','font-size':'12'},txt))});\n}\nfunction renderTable(c){\n  els.tbody.innerHTML='';\n  c.items.forEach(it=>{\n    const tr=document.createElement('tr');\n    if(!c.fit) tr.classList.add('invalid-row');\n    const xCell=c.fit?fmt(it.x,2):'<span class=\"invalid-cell\">INVÁLIDA<\/span>';\n    const gapCell=c.fit?(it.gapBefore==null?'—':fmt(it.gapBefore,3)):'<span class=\"invalid-cell\">—<\/span>';\n    tr.innerHTML=`<td>${String(it.i+1).padStart(2,'0')}<\/td><td>${fmt(it.d,1)}<\/td><td>${xCell}<\/td><td>${fmt(it.y,2)}<\/td><td>${fmt(it.opening,2)}<\/td><td>${fmt(it.arc,1)}°<\/td><td>${gapCell}<\/td>`;\n    els.tbody.appendChild(tr);\n  });\n}\nfunction update(){\n  const c=calc(); draw(c); renderTable(c);\n  const avgGap=c.gaps.length?c.gaps.reduce((a,b)=>a+b,0)/c.gaps.length:0;\n  const maxOpen=c.items.length?Math.max(...c.items.map(x=>x.opening)):0; const maxY=c.items.length?Math.max(...c.items.map(x=>x.y)):0;\n  els.mRequired.textContent=fmt(c.required,2)+' mm'; els.mGap.textContent=(c.fit&&c.gaps.length?fmt(avgGap,3)+' mm':(c.fit?'—':'INVÁLIDO')); els.mOpening.textContent=(c.items.length?fmt(maxOpen,2)+' mm':'—'); els.mY.textContent=(c.items.length?fmt(maxY,2)+' mm':'—');\n  els.status.className='status '+(c.fit?'ok':'bad'); els.status.textContent=c.message;\n}\nfunction setExample(){tools=[60,100];seq=[60,100,60,60,100,60,60,100,60,60,100,60,60,100,60];els.boardW.value=1900;els.boardH.value=130;els.edgeReserve.value=50;els.fitRule.value='equal';els.percent.value=70;els.showAccum.checked=true;renderTools();renderSequence();update()}\n$('#addDiameter').addEventListener('click',()=>{if(tools.length<10){let v=tools[tools.length-1]||50;while(tools.some(x=>Math.abs(x-v)<1e-9))v+=10;tools.push(v);renderTools();update();}});\n$('#clearSeq').addEventListener('click',()=>{seq=[];renderSequence();update()});\n$('#exampleSeq').addEventListener('click',()=>{seq=[60,100,60,60,100,60,60,100,60,60,100,60,60,100,60]; if(!tools.some(x=>x===60))tools.push(60);if(!tools.some(x=>x===100)&&tools.length<10)tools.push(100);renderTools();renderSequence();update()});\n$('#resetBtn').addEventListener('click',setExample);\n[els.boardW,els.boardH,els.edgeReserve,els.percent,els.fitRule,els.showAccum].forEach(e=>e.addEventListener('input',update));\n$('#printBtn').addEventListener('click',()=>{const c=calc();if(!c.fit){alert('Projeto inválido: os furos e as reservas não cabem na chapa. Ajuste o comprimento, os diâmetros ou a reserva antes de imprimir para fabricação.');return;}window.print();});\n$('#csvBtn').addEventListener('click',()=>{const c=calc();if(!c.fit){alert('Exportação bloqueada: o projeto não cabe na chapa e as cotas X estão inválidas para fabricação.');return;}const rows=[['Nº','Diâmetro (mm)','X centro acumulado (mm)','Y centro (mm)','Abertura na borda (mm)','Arco interno (%)','Vão anterior (mm)']];c.items.forEach(it=>rows.push([it.i+1,it.d,it.x.toFixed(3),it.y.toFixed(3),it.opening.toFixed(3),(c.p*100).toFixed(2),it.gapBefore==null?'':it.gapBefore.toFixed(3)]));const csv=rows.map(r=>r.join(';')).join('\\n');const blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='marcacao_serra_copo_v3.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});\nconst app=$('#app');\nfunction setMobileTab(tab){\n  app.dataset.mobileTab=tab;\n  $$('.mobile-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));\n  if(tab==='croqui') setTimeout(()=>els.drawing.scrollIntoView({block:'start',behavior:'smooth'}),20);\n}\n$$('.mobile-tab').forEach(b=>b.addEventListener('click',()=>setMobileTab(b.dataset.tab)));\napp.dataset.mobileTab='config';\nrenderTools();renderSequence();update();\n\nwindow.__precisionEdge={\n  snapshot:()=>({tools:[...tools],seq:[...seq]}),\n  restore:s=>{\n    if(!Array.isArray(s.tools)||!Array.isArray(s.seq))return;\n    const t=s.tools.map(Number), q=s.seq.map(Number);\n    if(t.length<1||t.length>10||q.length>100||t.some(x=>!Number.isFinite(x)||x<=0||x>1000)||q.some(x=>!t.includes(x)))return;\n    tools=t;seq=q;renderTools();renderSequence();update();\n  },\n  valid:()=>calc().fit\n};\n})();\n<\/script>\n<\/body>\n<\/html>\n", "saw-grid": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />\n<title>Croqui Paramétrico — Serra-copo<\/title>\n<style>\n  :root{\n    color-scheme: light dark;\n    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --text:#eef2f7; --muted:#9aa7b5;\n    --line:#4f6073; --accent:#5fb3ff; --accent2:#ffb454; --ok:#59d185; --warn:#ffcc66; --danger:#ff6b6b;\n    --board:#d9b67b; --boardStroke:#f2d39a; --hole:#78c8ff; --dim:#cdd7e2; --reserve:#f0a45b;\n    --shadow:0 14px 40px rgba(0,0,0,.25);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}\n  .app{display:grid;grid-template-columns:minmax(290px,360px) 1fr;min-height:100vh}\n  aside{background:var(--panel);padding:18px;border-right:1px solid #2b313c;position:sticky;top:0;height:100vh;overflow:auto}\n  main{padding:18px;min-width:0}\n  h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.45}\n  .group{background:var(--panel2);border:1px solid #2b313c;border-radius:12px;padding:12px;margin:0 0 12px}\n  .group h2{font-size:13px;margin:0 0 10px;color:#dce7f4}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n  label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}\n  input,select,button{font:inherit}\n  input,select{width:100%;border:1px solid #3a4350;background:#11151b;color:var(--text);border-radius:8px;padding:9px 10px;outline:none}\n  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(95,179,255,.14)}\n  .field{margin-bottom:9px}.field:last-child{margin-bottom:0}\n  .hint{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}\n  .checkrow{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid #3a4350;background:#11151b;border-radius:8px;cursor:pointer}\n  .checkrow input{width:auto;min-width:17px;height:17px;margin:1px 0 0;accent-color:var(--accent)}\n  .checkrow span{font-size:12px;color:var(--text);line-height:1.35}\n  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n  button{border:0;border-radius:9px;padding:10px 12px;background:#2a3340;color:var(--text);cursor:pointer;font-weight:650}\n  button.primary{background:var(--accent);color:#06131f}.buttons button:hover{filter:brightness(1.08)}\n  .status{padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.45;background:#10271a;border:1px solid #214f33;color:#c8f3d7}\n  .status.warn{background:#2c2511;border-color:#69561e;color:#ffe08a}\n  .status.err{background:#2e1518;border-color:#6f2e35;color:#ffd0d5}\n  .cards{display:grid;grid-template-columns:repeat(6,minmax(105px,1fr));gap:9px;margin-bottom:12px}\n  .card{background:var(--panel);border:1px solid #2b313c;border-radius:11px;padding:10px;min-width:0}\n  .card .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.card .v{font-size:18px;font-weight:750;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .u{font-size:10px;color:var(--muted)}\n  .canvasWrap{background:#0b0d11;border:1px solid #2b313c;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}\n  .toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #262c35;background:#13171d;font-size:12px;color:var(--muted)}\n  #svgHost{width:100%;height:min(64vh,720px);min-height:420px;display:flex;align-items:center;justify-content:center;overflow:auto}\n  svg{width:100%;height:100%;display:block}\n  .tableWrap{margin-top:12px;background:var(--panel);border:1px solid #2b313c;border-radius:12px;overflow:auto;max-height:330px}\n  table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 10px;border-bottom:1px solid #2b313c;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#1b2028;color:#cbd6e2;z-index:1}th:first-child,td:first-child{text-align:left}\n  .legend{display:flex;flex-wrap:wrap;gap:12px}.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.dot.board{background:var(--board)}.dot.hole{background:var(--hole)}.dot.reserve{background:var(--reserve)}\n  @media (max-width:980px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid #2b313c}.cards{grid-template-columns:repeat(3,1fr)}#svgHost{height:56vh;min-height:360px}}\n  @media (max-width:560px){aside,main{padding:12px}.grid2{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:flex-start;flex-direction:column}#svgHost{min-height:330px;height:52vh}}\n  @media print{aside,.toolbar,.cards{display:none!important}.app{display:block}.canvasWrap,.tableWrap{border:0;box-shadow:none}body{background:white;color:black}main{padding:0}#svgHost{height:70vh}.tableWrap{max-height:none;overflow:visible;break-before:page}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <aside>\n    <h1>Croqui paramétrico — serra-copo<\/h1>\n    <div class=\"sub\">No desenho, <b>FUNDO<\/b> fica em cima e <b>FRENTE<\/b> embaixo. As cotas acumuladas até os centros são mostradas <b>nos quatro sentidos<\/b>: esquerda → centro, direita → centro, fundo → centro e frente → centro. A fileira frontal pode ultrapassar a chapa.<\/div>\n\n    <div class=\"group\">\n      <h2>Geometria da chapa<\/h2>\n      <div class=\"grid2\">\n        <div class=\"field\"><label>Largura da chapa (mm)<\/label><input id=\"W\" inputmode=\"decimal\" value=\"600\"><\/div>\n        <div class=\"field\"><label>Profundidade da chapa (mm)<\/label><input id=\"H\" inputmode=\"decimal\" value=\"250\"><\/div>\n      <\/div>\n      <div class=\"grid2\">\n        <div class=\"field\"><label>Reserva lateral/fundo (mm)<\/label><input id=\"M\" inputmode=\"decimal\" value=\"15\"><\/div>\n        <div class=\"field\"><label>Distância livre entre círculos (mm)<\/label><input id=\"G\" inputmode=\"decimal\" value=\"15\"><\/div>\n      <\/div>\n      <div class=\"field\"><label>Diâmetro da serra-copo (mm)<\/label><input id=\"D\" inputmode=\"decimal\" value=\"75\"><\/div>\n    <\/div>\n\n    <div class=\"group\">\n      <h2>Primeira fileira / borda frontal<\/h2>\n      <div class=\"field\">\n        <label>Percentual do 1º furo (%) — deixe vazio para automático<\/label>\n        <input id=\"PCT\" inputmode=\"decimal\" placeholder=\"Automático\">\n        <div class=\"hint\">No automático, o programa maximiza a quantidade de fileiras, mantém a reserva do fundo e calcula quanto do círculo frontal pode ficar na chapa.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>O percentual representa<\/label>\n        <select id=\"PMODE\">\n          <option value=\"circ\" selected>Percentual da circunferência dentro da chapa<\/option>\n          <option value=\"depth\">Percentual do diâmetro/profundidade dentro da chapa<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>Distribuição lateral<\/label>\n        <select id=\"ALIGN\">\n          <option value=\"center\" selected>Centralizar o conjunto entre as laterais<\/option>\n          <option value=\"left\">Começar exatamente na reserva da esquerda<\/option>\n        <\/select>\n        <div class=\"hint\">A reserva informada é tratada como mínima. Centralizar mantém as duas laterais simétricas quando sobra espaço.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>Arredondamento das cotas acumuladas<\/label>\n        <label class=\"checkrow\"><input id=\"INTDIMS\" type=\"checkbox\"><span><b>Preferir números inteiros<\/b><br><span class=\"hint\">Redistribui os centros para privilegiar cotas acumuladas inteiras. Com largura e profundidade inteiras, as cotas esquerda/direita e fundo/frente até os centros também serão inteiras, sem reduzir a reserva nem a distância mínima entre os furos.<\/span><\/span><\/label>\n      <\/div>\n    <\/div>\n\n    <div class=\"group\">\n      <h2>Ações<\/h2>\n      <div class=\"buttons\">\n        <button class=\"primary\" id=\"recalc\">Recalcular<\/button>\n        <button id=\"autoPct\">Percentual automático<\/button>\n        <button id=\"saveSvg\">Exportar SVG<\/button>\n        <button id=\"saveCsv\">Exportar centros CSV<\/button>\n        <button id=\"printBtn\">Imprimir / PDF<\/button>\n        <button id=\"resetBtn\">Restaurar padrão<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"status\" class=\"status\">Pronto.<\/div>\n  <\/aside>\n\n  <main>\n    <div class=\"cards\">\n      <div class=\"card\"><div class=\"k\">Colunas<\/div><div class=\"v\" id=\"cCols\">—<\/div><div class=\"u\">na largura<\/div><\/div>\n      <div class=\"card\"><div class=\"k\">Fileiras<\/div><div class=\"v\" id=\"cRows\">—<\/div><div class=\"u\">fundo → frente<\/div><\/div>\n      <div class=\"card\"><div class=\"k\">Total<\/div><div class=\"v\" id=\"cTotal\">—<\/div><div class=\"u\">centros<\/div><\/div>\n      <div class=\"card\"><div class=\"k\">1º furo<\/div><div class=\"v\" id=\"cPct\">—<\/div><div class=\"u\">dentro da chapa<\/div><\/div>\n      <div class=\"card\"><div class=\"k\">Avanço fora<\/div><div class=\"v\" id=\"cOver\">—<\/div><div class=\"u\">na frente<\/div><\/div>\n      <div class=\"card\"><div class=\"k\">Margem lateral<\/div><div class=\"v\" id=\"cSide\">—<\/div><div class=\"u\">real / mínima<\/div><\/div>\n    <\/div>\n\n    <div class=\"canvasWrap\">\n      <div class=\"toolbar\">\n        <div class=\"legend\"><span><i class=\"dot board\"><\/i>Chapa<\/span><span><i class=\"dot hole\"><\/i>Círculos<\/span><span><i class=\"dot reserve\"><\/i>Reservas<\/span><\/div>\n        <div id=\"summaryLine\">—<\/div>\n      <\/div>\n      <div id=\"svgHost\"><\/div>\n    <\/div>\n\n    <div class=\"tableWrap\">\n      <table>\n        <thead><tr><th>Furo<\/th><th>Fileira<\/th><th>Coluna<\/th><th>Esquerda → centro X (mm)<\/th><th>Direita → centro X (mm)<\/th><th>Fundo → centro Y (mm)<\/th><th>Frente → centro Y (mm)<\/th><th>Situação<\/th><\/tr><\/thead>\n        <tbody id=\"tbody\"><\/tbody>\n      <\/table>\n    <\/div>\n  <\/main>\n<\/div>\n\n<script>\n(() => {\n  const $ = id => document.getElementById(id);\n  const els = {W:$('W'),H:$('H'),M:$('M'),G:$('G'),D:$('D'),PCT:$('PCT'),PMODE:$('PMODE'),ALIGN:$('ALIGN'),INTDIMS:$('INTDIMS')};\n  let current = null;\n\n  function num(v){\n    if (v == null || v === '') return NaN;\n    return Number(String(v).trim().replace(',', '.'));\n  }\n  function fmt(v, d=2){\n    if (!Number.isFinite(v)) return '—';\n    return v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});\n  }\n  function pctToCenterInside(p, mode, r, D){\n    const f = Math.max(0, Math.min(100, p)) / 100;\n    if (mode === 'depth') return D * f - r;\n    return r * Math.cos(Math.PI * (1 - f));\n  }\n  function centerInsideToPct(c, mode, r, D){\n    if (c <= -r) return 0;\n    if (c >= r) return 100;\n    if (mode === 'depth') return ((c + r) / D) * 100;\n    return (1 - Math.acos(c / r) / Math.PI) * 100;\n  }\n\n  function calculate(){\n    const W=num(els.W.value), H=num(els.H.value), M=num(els.M.value), G=num(els.G.value), D=num(els.D.value);\n    const mode=els.PMODE.value, align=els.ALIGN.value, preferIntegers=els.INTDIMS.checked;\n    const pctRaw=els.PCT.value.trim();\n    const pctUser = pctRaw === '' ? null : num(pctRaw);\n    const vals=[W,H,M,G,D];\n    if (vals.some(v=>!Number.isFinite(v)) || W<=0 || H<=0 || M<0 || G<0 || D<=0) throw new Error('Confira os valores: dimensões e diâmetro devem ser positivos; reserva e distância não podem ser negativas.');\n    if (pctUser !== null && (!Number.isFinite(pctUser) || pctUser<=0 || pctUser>100)) throw new Error('O percentual deve ser maior que 0% e no máximo 100%.');\n    if (W <= 2*M) throw new Error('A largura da chapa é menor ou igual à soma das duas reservas laterais.');\n    if (H <= M) throw new Error('A profundidade da chapa não deixa espaço após a reserva do fundo.');\n\n    const r=D/2, nominalPitch=D+G;\n    // Com \"preferir inteiros\", o passo é o menor inteiro que nunca reduz a folga solicitada.\n    // Assim, se a geometria original já usa passo inteiro (ex.: 75+15=90), ele permanece inalterado.\n    const pitchX=preferIntegers ? Math.ceil(nominalPitch-1e-9) : nominalPitch;\n    const pitchY=preferIntegers ? Math.ceil(nominalPitch-1e-9) : nominalPitch;\n\n    // Quantidade máxima de colunas respeitando reservas e distância mínima.\n    let nCols=Math.floor((W-2*(M+r) + 1e-9)/pitchX)+1;\n    if (nCols < 1) throw new Error('Não cabe nenhum círculo completo entre as reservas laterais. Reduza o diâmetro/reserva ou aumente a largura.');\n\n    let x0;\n    if (preferIntegers){\n      const minX=Math.ceil(M+r-1e-9);\n      const maxX=Math.floor(W-M-r-(nCols-1)*pitchX+1e-9);\n      if (maxX < minX) {\n        nCols--;\n        if(nCols<1) throw new Error('Não foi possível obter cotas inteiras respeitando as reservas laterais.');\n      }\n      const minX2=Math.ceil(M+r-1e-9);\n      const maxX2=Math.floor(W-M-r-(nCols-1)*pitchX+1e-9);\n      if (align==='left') x0=minX2;\n      else {\n        const ideal=(W-(nCols-1)*pitchX)/2;\n        x0=Math.max(minX2,Math.min(maxX2,Math.round(ideal)));\n      }\n    } else {\n      const patternW=nCols*D+(nCols-1)*G;\n      const marginL=align==='center' ? (W-patternW)/2 : M;\n      x0=marginL+r;\n    }\n    const xs=Array.from({length:nCols},(_,i)=>x0+i*pitchX);\n    const marginL=xs[0]-r, marginR=W-(xs[xs.length-1]+r);\n    const patternW=(xs[xs.length-1]+r)-(xs[0]-r);\n    const actualGapX=nCols>1 ? pitchX-D : 0;\n\n    let yFront, pct, isAuto=false, nRows=0, autoRawCenterInside=null, requestedPct=pctUser;\n    if (pctUser === null){\n      isAuto=true;\n      // Primeira fileira completa junto ao fundo. No modo inteiro, a cota do centro é arredondada\n      // para cima para nunca invadir a reserva mínima.\n      const yBack=preferIntegers ? Math.ceil(M+r-1e-9) : M+r;\n      nRows=Math.floor((H+r-yBack-1e-9)/pitchY)+1;\n      if (nRows < 1) nRows=1;\n      yFront=yBack+(nRows-1)*pitchY;\n      let c=H-yFront;\n      // Tangência pura (0% útil) não conta como fileira.\n      if (c <= -r + 1e-8 && nRows>1){\n        nRows--;\n        yFront=yBack+(nRows-1)*pitchY;\n        c=H-yFront;\n      }\n      autoRawCenterInside=c;\n      pct=centerInsideToPct(c,mode,r,D);\n    } else {\n      const cWanted=pctToCenterInside(pctUser,mode,r,D);\n      const yWanted=H-cWanted;\n      yFront=preferIntegers ? Math.round(yWanted) : yWanted;\n      // Se o arredondamento colocar a fileira frontal totalmente fora, trazemos o centro\n      // para a última posição inteira ainda útil.\n      if(preferIntegers && yFront>=H+r) yFront=Math.ceil(H+r)-1;\n      const minCenter=M+r;\n      const maxRows=Math.floor((yFront-minCenter+1e-9)/pitchY)+1;\n      nRows=Math.max(1,maxRows);\n      let yBack=yFront-(nRows-1)*pitchY;\n      if (preferIntegers && yBack < minCenter-1e-9){\n        nRows--;\n        if(nRows<1) throw new Error('Com esse percentual não existe posição inteira que respeite a reserva do fundo.');\n        yBack=yFront-(nRows-1)*pitchY;\n      }\n      if (yBack-r < M-1e-8) throw new Error('Com esse percentual, o primeiro furo invade a reserva do fundo. Reduza o percentual ou aumente a profundidade da chapa.');\n      const cActual=H-yFront;\n      pct=centerInsideToPct(cActual,mode,r,D);\n    }\n\n    const ysFrontToBack=Array.from({length:nRows},(_,i)=>yFront-i*pitchY);\n    const ysBackToFront=[...ysFrontToBack].reverse();\n    const frontCenterInside=H-yFront;\n    const overhang=Math.max(0, r-frontCenterInside);\n    const frontGap=Math.max(0, frontCenterInside-r);\n    const backMargin=ysBackToFront[0]-r;\n    const actualGapY=nRows>1 ? pitchY-D : 0;\n\n    const holes=[];\n    let id=1;\n    ysFrontToBack.forEach((y,ri)=>{\n      xs.forEach((x,ci)=>{\n        holes.push({id:id++, row:ri+1, col:ci+1, x, y, front:ri===0});\n      });\n    });\n\n    const result={W,H,M,G,D,r,nominalPitch,pitchX,pitchY,mode,align,preferIntegers,pct,pctUser,requestedPct,isAuto,nCols,nRows,patternW,marginL,marginR,xs,ysFrontToBack,ysBackToFront,yFront,frontCenterInside,overhang,frontGap,backMargin,holes,autoRawCenterInside,actualGapX,actualGapY};\n    current=result;\n    render(result);\n    return result;\n  }\n\n  function setStatus(msg,type='ok'){\n    const s=$('status'); s.className='status'+(type==='warn'?' warn':type==='err'?' err':''); s.textContent=msg;\n  }\n\n  function render(r){\n    $('cCols').textContent=r.nCols;\n    $('cRows').textContent=r.nRows;\n    $('cTotal').textContent=r.holes.length;\n    $('cPct').textContent=fmt(r.pct,2)+'%';\n    $('cOver').textContent=fmt(r.overhang,2)+' mm';\n    $('cSide').textContent=fmt(r.marginL,2)+' / '+fmt(r.M,2)+' mm';\n    $('summaryLine').textContent=`Passo X/Y: ${fmt(r.pitchX,2)} / ${fmt(r.pitchY,2)} mm · Folga real X/Y: ${fmt(r.actualGapX,2)} / ${fmt(r.actualGapY,2)} mm · Cotas acumuladas: E↔centros↔D e fundo↔centros↔frente${r.preferIntegers?' · modo inteiro ativo':''}`;\n\n    const typeText = r.mode==='circ' ? 'circunferência' : 'diâmetro';\n    let msg=`${r.holes.length} furos: ${r.nCols} colunas × ${r.nRows} fileiras. Fileira frontal: ${fmt(r.pct,2)}% da ${typeText} dentro da chapa; avanço para fora: ${fmt(r.overhang,2)} mm.`;\n    if(r.preferIntegers) {\n      if(Number.isInteger(r.W) && Number.isInteger(r.H)) msg += ` Modo inteiro ativo: as cotas acumuladas dos centros nos quatro sentidos são números inteiros.`;\n      else msg += ` Modo inteiro ativo: os centros foram posicionados em coordenadas inteiras; para que as cotas dos dois lados também sejam todas inteiras, largura e profundidade da chapa precisam ser inteiras.`;\n    }\n    if(r.preferIntegers && r.pctUser!==null && Math.abs(r.pct-r.pctUser)>0.005) msg += ` O percentual solicitado (${fmt(r.pctUser,2)}%) foi ajustado para ${fmt(r.pct,2)}% para obter cota Y inteira.`;\n    if (r.frontGap>0.0001) msg += ` O último círculo fica totalmente dentro da chapa, com ${fmt(r.frontGap,2)} mm livres até a frente.`;\n    if (r.pctUser !== null){\n      const auto = calcAutoReference(r);\n      if (auto && auto.nRows > r.nRows) msg += ` Com percentual automático caberiam ${auto.nRows} fileiras (${fmt(auto.pct,2)}%).`;\n    }\n    setStatus(msg, 'ok');\n    drawSvg(r);\n    renderTable(r);\n  }\n\n  function calcAutoReference(r){\n    const yBack=r.preferIntegers ? Math.ceil(r.M+r.r-1e-9) : r.M+r.r;\n    let n=Math.floor((r.H+r.r-yBack-1e-9)/r.pitchY)+1;\n    if(n<1)return null;\n    let yf=yBack+(n-1)*r.pitchY;\n    let c=r.H-yf;\n    if(c<=-r.r+1e-8 && n>1){n--;yf=yBack+(n-1)*r.pitchY;c=r.H-yf;}\n    return {nRows:n,pct:centerInsideToPct(c,r.mode,r.r,r.D)};\n  }\n\n  function renderTable(r){\n    $('tbody').innerHTML=r.holes.map(h=>{\n      const situ=h.front ? (r.overhang>0.0001 ? `Frontal · ultrapassa ${fmt(r.overhang,2)} mm` : 'Frontal · dentro da chapa') : 'Completo';\n      const xRight=r.W-h.x;\n      const yFront=r.H-h.y;\n      return `<tr><td>F${h.id}<\/td><td>${h.row}${h.front?' (frente)':''}<\/td><td>${h.col}<\/td><td>${fmt(h.x,3)}<\/td><td>${fmt(xRight,3)}<\/td><td>${fmt(h.y,3)}<\/td><td>${fmt(yFront,3)}${yFront<0?' (fora)':''}<\/td><td>${situ}<\/td><\/tr>`;\n    }).join('');\n  }\n\n  function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&apos;'}[m]));}\n\n  function drawSvg(r){\n    const extraLeft=Math.max(135, r.D*1.0 + r.nRows*18), extraTop=Math.max(100,r.D*0.85 + r.nCols*14), extraRight=Math.max(155,r.D*1.25 + r.nRows*18), extraBottom=Math.max(145,r.D*1.15+r.overhang+r.nCols*14);\n    const minX=-extraLeft, minY=-extraTop, vbW=r.W+extraLeft+extraRight, vbH=r.H+extraTop+extraBottom+r.overhang;\n    const f=Math.max(7,Math.min(12,r.W/55));\n    const small=f*0.78;\n    const sw=Math.max(.65,r.W/950);\n    const arrow=8;\n\n    let s=`<svg id=\"croquiSvg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"${minX} ${minY} ${vbW} ${vbH}\" role=\"img\" aria-label=\"Croqui paramétrico com cotas acumuladas dos centros nos quatro sentidos\">\n      <defs>\n        <marker id=\"arr\" markerWidth=\"${arrow}\" markerHeight=\"${arrow}\" refX=\"4\" refY=\"4\" orient=\"auto-start-reverse\" markerUnits=\"strokeWidth\"><path d=\"M8,4 L0,0 L0,8 Z\" fill=\"#cdd7e2\"/><\/marker>\n        <clipPath id=\"boardClip\"><rect x=\"0\" y=\"0\" width=\"${r.W}\" height=\"${r.H}\"/><\/clipPath>\n        <style>\n          .board{fill:#d9b67b;fill-opacity:.18;stroke:#f2d39a;stroke-width:${sw*1.6}}\n          .reserve{stroke:#f0a45b;stroke-width:${sw};stroke-dasharray:${sw*5} ${sw*4};opacity:.9}\n          .holeFull{fill:none;stroke:#78c8ff;stroke-width:${sw};stroke-dasharray:${sw*5} ${sw*4};opacity:.45}\n          .holeIn{fill:#78c8ff;fill-opacity:.06;stroke:#78c8ff;stroke-width:${sw*1.45}}\n          .center{stroke:#ffcc66;stroke-width:${sw*1.15}}\n          .dim{stroke:#cdd7e2;stroke-width:${sw};fill:none;marker-start:url(#arr);marker-end:url(#arr)}\n          .ext{stroke:#758496;stroke-width:${sw*.75};stroke-dasharray:${sw*3} ${sw*3}}\n          .tick{stroke:#cdd7e2;stroke-width:${sw}}\n          .txt{font-family:Arial,sans-serif;fill:#eef2f7;font-size:${f}px;paint-order:stroke;stroke:#0b0d11;stroke-width:${sw*2};stroke-linejoin:round}\n          .small{font-family:Arial,sans-serif;fill:#d6e1ec;font-size:${small}px;paint-order:stroke;stroke:#0b0d11;stroke-width:${sw*1.8};stroke-linejoin:round}\n          .accent{fill:#ffcc66}.front{fill:#ffb454;font-weight:bold}.back{fill:#9dd4ff;font-weight:bold}\n        <\/style>\n      <\/defs>`;\n\n    // placa + reservas\n    s+=`<rect class=\"board\" x=\"0\" y=\"0\" width=\"${r.W}\" height=\"${r.H}\"/>`;\n    s+=`<line class=\"reserve\" x1=\"${r.M}\" y1=\"0\" x2=\"${r.M}\" y2=\"${r.H}\"/><line class=\"reserve\" x1=\"${r.W-r.M}\" y1=\"0\" x2=\"${r.W-r.M}\" y2=\"${r.H}\"/><line class=\"reserve\" x1=\"0\" y1=\"${r.M}\" x2=\"${r.W}\" y2=\"${r.M}\"/>`;\n    s+=`<text class=\"txt back\" x=\"${r.W/2}\" y=\"${-f*1.5}\" text-anchor=\"middle\">FUNDO<\/text>`;\n    s+=`<text class=\"txt front\" x=\"${r.W/2}\" y=\"${r.H+r.overhang+f*3.0}\" text-anchor=\"middle\">FRENTE<\/text>`;\n    s+=`<text class=\"small\" x=\"4\" y=\"${f+3}\">Origem (0,0)<\/text>`;\n\n    // furos\n    const cross=Math.max(3.5,r.D*0.065);\n    r.holes.forEach(h=>{\n      if(h.front && r.overhang>0){s+=`<circle class=\"holeFull\" cx=\"${h.x}\" cy=\"${h.y}\" r=\"${r.r}\"/>`;}\n      s+=`<circle class=\"holeIn\" clip-path=\"url(#boardClip)\" cx=\"${h.x}\" cy=\"${h.y}\" r=\"${r.r}\"/>`;\n      s+=`<line class=\"center\" x1=\"${h.x-cross}\" y1=\"${h.y}\" x2=\"${h.x+cross}\" y2=\"${h.y}\"/><line class=\"center\" x1=\"${h.x}\" y1=\"${h.y-cross}\" x2=\"${h.x}\" y2=\"${h.y+cross}\"/>`;\n      s+=`<text class=\"small accent\" x=\"${h.x}\" y=\"${h.y-r.r*0.12}\" text-anchor=\"middle\">F${h.id}<\/text>`;\n    });\n\n    // dimensão geral largura\n    const yDim=-(f*4.4 + r.nCols*f*1.35);\n    s+=`<line class=\"ext\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"${yDim+f}\"/><line class=\"ext\" x1=\"${r.W}\" y1=\"0\" x2=\"${r.W}\" y2=\"${yDim+f}\"/>`;\n    s+=`<line class=\"dim\" x1=\"0\" y1=\"${yDim}\" x2=\"${r.W}\" y2=\"${yDim}\"/><text class=\"txt\" x=\"${r.W/2}\" y=\"${yDim-f*.55}\" text-anchor=\"middle\">L = ${fmt(r.W,2)} mm<\/text>`;\n    // dimensão geral profundidade — posicionada à esquerda das cotas acumuladas vindas da frente\n    const xDim=-(f*(8.2+r.nRows*1.85));\n    s+=`<line class=\"ext\" x1=\"0\" y1=\"0\" x2=\"${xDim+f}\" y2=\"0\"/><line class=\"ext\" x1=\"0\" y1=\"${r.H}\" x2=\"${xDim+f}\" y2=\"${r.H}\"/>`;\n    s+=`<line class=\"dim\" x1=\"${xDim}\" y1=\"0\" x2=\"${xDim}\" y2=\"${r.H}\"/><text class=\"txt\" x=\"${xDim-f*.7}\" y=\"${r.H/2}\" text-anchor=\"middle\" transform=\"rotate(-90 ${xDim-f*.7} ${r.H/2})\">P = ${fmt(r.H,2)} mm<\/text>`;\n\n    // COTAS ACUMULADAS X: borda esquerda -> centro de cada coluna.\n    // Cada cota tem sua própria linha-base para ficar inequívoco que é acumulada, não incremental.\n    const xCumBase=-f*2.0;\n    r.xs.forEach((x,i)=>{\n      const yy=xCumBase-i*f*1.35;\n      s+=`<line class=\"ext\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"${yy+f*.5}\"/><line class=\"ext\" x1=\"${x}\" y1=\"0\" x2=\"${x}\" y2=\"${yy+f*.5}\"/>`;\n      s+=`<line class=\"dim\" x1=\"0\" y1=\"${yy}\" x2=\"${x}\" y2=\"${yy}\"/>`;\n      s+=`<text class=\"small\" x=\"${x/2}\" y=\"${yy-small*.55}\" text-anchor=\"middle\">X${i+1} E→C = ${fmt(x,2)} mm<\/text>`;\n    });\n\n    // COTAS ACUMULADAS X NO SENTIDO OPOSTO: borda direita -> centro de cada coluna.\n    // São mostradas abaixo da chapa para não confundir com as cotas vindas da esquerda.\n    const xRightBase=r.H+Math.max(r.overhang,0)+f*8.2;\n    r.xs.slice().reverse().forEach((x,j)=>{\n      const col=r.nCols-j;\n      const yy=xRightBase+j*f*1.35;\n      const val=r.W-x;\n      s+=`<line class=\"ext\" x1=\"${r.W}\" y1=\"${r.H}\" x2=\"${r.W}\" y2=\"${yy-f*.5}\"/><line class=\"ext\" x1=\"${x}\" y1=\"${Math.min(r.H,r.yFront+r.r)}\" x2=\"${x}\" y2=\"${yy-f*.5}\"/>`;\n      s+=`<line class=\"dim\" x1=\"${x}\" y1=\"${yy}\" x2=\"${r.W}\" y2=\"${yy}\"/>`;\n      s+=`<text class=\"small\" x=\"${(x+r.W)/2}\" y=\"${yy-small*.55}\" text-anchor=\"middle\">X${col} D→C = ${fmt(val,2)} mm<\/text>`;\n    });\n\n    // COTAS ACUMULADAS Y: borda do fundo -> centro de cada fileira.\n    const yCumBase=r.W+f*3.0;\n    r.ysBackToFront.forEach((y,i)=>{\n      const xx=yCumBase+i*f*1.75;\n      s+=`<line class=\"ext\" x1=\"0\" y1=\"0\" x2=\"${xx-f*.5}\" y2=\"0\"/><line class=\"ext\" x1=\"${r.W}\" y1=\"${y}\" x2=\"${xx-f*.5}\" y2=\"${y}\"/>`;\n      s+=`<line class=\"dim\" x1=\"${xx}\" y1=\"0\" x2=\"${xx}\" y2=\"${y}\"/>`;\n      s+=`<text class=\"small\" x=\"${xx+small*.8}\" y=\"${y/2}\" transform=\"rotate(-90 ${xx+small*.8} ${y/2})\" text-anchor=\"middle\">Y${i+1} fundo→C = ${fmt(y,2)} mm<\/text>`;\n    });\n\n    // COTAS ACUMULADAS Y NO SENTIDO OPOSTO: borda frontal -> centro de cada fileira.\n    // Quando o centro da primeira fileira estiver fora da chapa, a cota é negativa e recebe a indicação \"fora\".\n    const yFrontBase=-(f*7.0);\n    r.ysFrontToBack.forEach((y,j)=>{\n      const rowFront=j+1;\n      const xx=yFrontBase-j*f*1.75;\n      const val=r.H-y;\n      const yMin=Math.min(r.H,y), yMax=Math.max(r.H,y);\n      s+=`<line class=\"ext\" x1=\"0\" y1=\"${r.H}\" x2=\"${xx+f*.5}\" y2=\"${r.H}\"/><line class=\"ext\" x1=\"0\" y1=\"${y}\" x2=\"${xx+f*.5}\" y2=\"${y}\"/>`;\n      s+=`<line class=\"dim\" x1=\"${xx}\" y1=\"${yMin}\" x2=\"${xx}\" y2=\"${yMax}\"/>`;\n      const label=`Y${rowFront} frente→C = ${fmt(val,2)} mm${val<0?' (fora)':''}`;\n      s+=`<text class=\"small\" x=\"${xx-small*.8}\" y=\"${(r.H+y)/2}\" transform=\"rotate(-90 ${xx-small*.8} ${(r.H+y)/2})\" text-anchor=\"middle\">${label}<\/text>`;\n    });\n\n    // margens laterais reais\n    const ySide=r.H+Math.max(r.overhang,0)+f*5.3;\n    const leftEdge=r.xs[0]-r.r, rightEdge=r.xs[r.xs.length-1]+r.r;\n    s+=`<line class=\"ext\" x1=\"0\" y1=\"${r.H}\" x2=\"0\" y2=\"${ySide-f}\"/><line class=\"ext\" x1=\"${leftEdge}\" y1=\"${r.H}\" x2=\"${leftEdge}\" y2=\"${ySide-f}\"/>`;\n    s+=`<line class=\"dim\" x1=\"0\" y1=\"${ySide}\" x2=\"${leftEdge}\" y2=\"${ySide}\"/><text class=\"small\" x=\"${leftEdge/2}\" y=\"${ySide-small*.55}\" text-anchor=\"middle\">margem ${fmt(r.marginL,2)}<\/text>`;\n    s+=`<line class=\"ext\" x1=\"${rightEdge}\" y1=\"${r.H}\" x2=\"${rightEdge}\" y2=\"${ySide-f}\"/><line class=\"ext\" x1=\"${r.W}\" y1=\"${r.H}\" x2=\"${r.W}\" y2=\"${ySide-f}\"/>`;\n    s+=`<line class=\"dim\" x1=\"${rightEdge}\" y1=\"${ySide}\" x2=\"${r.W}\" y2=\"${ySide}\"/><text class=\"small\" x=\"${(rightEdge+r.W)/2}\" y=\"${ySide-small*.55}\" text-anchor=\"middle\">margem ${fmt(r.marginR,2)}<\/text>`;\n\n    // diâmetro no furo traseiro esquerdo\n    const x0=r.xs[0], y0=r.ysBackToFront[0];\n    s+=`<line class=\"dim\" x1=\"${x0-r.r}\" y1=\"${y0}\" x2=\"${x0+r.r}\" y2=\"${y0}\"/><text class=\"small\" x=\"${x0}\" y=\"${y0-small*.7}\" text-anchor=\"middle\">Ø ${fmt(r.D,2)}<\/text>`;\n\n    // gap horizontal (se houver)\n    if(r.nCols>1){\n      const edge1=r.xs[0]+r.r, edge2=r.xs[1]-r.r, yg=y0+r.r+f*2.1;\n      s+=`<line class=\"dim\" x1=\"${edge1}\" y1=\"${yg}\" x2=\"${edge2}\" y2=\"${yg}\"/><text class=\"small\" x=\"${(edge1+edge2)/2}\" y=\"${yg-small*.65}\" text-anchor=\"middle\">${fmt(r.G,2)}<\/text>`;\n    }\n    // gap vertical (se houver)\n    if(r.nRows>1){\n      const yA=r.ysBackToFront[0]+r.r, yB=r.ysBackToFront[1]-r.r, xg=r.W+f*1.4;\n      s+=`<line class=\"dim\" x1=\"${xg}\" y1=\"${yA}\" x2=\"${xg}\" y2=\"${yB}\"/><text class=\"small\" x=\"${xg+small*.8}\" y=\"${(yA+yB)/2+small*.35}\">${fmt(r.G,2)}<\/text>`;\n    }\n\n    // reserva do fundo\n    const xBack=Math.max(f*2.0, r.xs[0]-r.r-f*2.5);\n    s+=`<line class=\"dim\" x1=\"${xBack}\" y1=\"0\" x2=\"${xBack}\" y2=\"${r.backMargin}\"/><text class=\"small\" x=\"${xBack+small*.8}\" y=\"${r.backMargin/2+small*.35}\">reserva ${fmt(r.backMargin,2)}<\/text>`;\n\n    // cota do centro frontal e avanço fora\n    const xf=r.W+f*(5.0+r.nRows*1.75);\n    s+=`<line class=\"ext\" x1=\"${r.W}\" y1=\"${r.H}\" x2=\"${xf-f}\" y2=\"${r.H}\"/><line class=\"ext\" x1=\"${r.W}\" y1=\"${r.yFront}\" x2=\"${xf-f}\" y2=\"${r.yFront}\"/>`;\n    s+=`<line class=\"dim\" x1=\"${xf}\" y1=\"${Math.min(r.yFront,r.H)}\" x2=\"${xf}\" y2=\"${Math.max(r.yFront,r.H)}\"/>`;\n    s+=`<text class=\"small\" x=\"${xf+small*.8}\" y=\"${(r.yFront+r.H)/2+small*.35}\">centro ↔ frente = ${fmt(Math.abs(r.frontCenterInside),2)}${r.frontCenterInside<0?' (centro fora)':''}<\/text>`;\n    if(r.overhang>0.0001){\n      const yOut=r.yFront+r.r, xfo=xf+f*3.7;\n      s+=`<line class=\"ext\" x1=\"${r.W}\" y1=\"${yOut}\" x2=\"${xfo-f}\" y2=\"${yOut}\"/><line class=\"dim\" x1=\"${xfo}\" y1=\"${r.H}\" x2=\"${xfo}\" y2=\"${yOut}\"/>`;\n      s+=`<text class=\"small front\" x=\"${xfo+small*.8}\" y=\"${(r.H+yOut)/2+small*.35}\">fora = ${fmt(r.overhang,2)}<\/text>`;\n    }\n    s+=`<text class=\"small front\" x=\"${r.W}\" y=\"${r.H+Math.max(r.overhang,0)+f*1.8}\" text-anchor=\"end\">1ª fileira: ${fmt(r.pct,2)}%<\/text>`;\n\n    s+='<\/svg>';\n    $('svgHost').innerHTML=s;\n  }\n\n  function downloadBlob(blob,name){\n    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();\n    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);\n  }\n  function exportSvg(){\n    if(!current) return;\n    const svg=$('croquiSvg');\n    const clone=svg.cloneNode(true);\n    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');\n    const xml='<?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n'+new XMLSerializer().serializeToString(clone);\n    downloadBlob(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),'croqui_serra_copo.svg');\n  }\n  function exportCsv(){\n    if(!current) return;\n    const lines=['Furo;Fileira;Coluna;Esquerda_ate_centro_X_mm;Direita_ate_centro_X_mm;Fundo_ate_centro_Y_mm;Frente_ate_centro_Y_mm;Frontal'];\n    current.holes.forEach(h=>{\n      const xr=current.W-h.x, yf=current.H-h.y;\n      lines.push(`F${h.id};${h.row};${h.col};${h.x.toFixed(3).replace('.',',')};${xr.toFixed(3).replace('.',',')};${h.y.toFixed(3).replace('.',',')};${yf.toFixed(3).replace('.',',')};${h.front?'SIM':'NAO'}`);\n    });\n    downloadBlob(new Blob(['\\ufeff'+lines.join('\\n')],{type:'text/csv;charset=utf-8'}),'centros_serra_copo.csv');\n  }\n\n  function safeCalc(){try{calculate();}catch(e){setStatus(e.message,'err');$('svgHost').innerHTML='';$('tbody').innerHTML='';['cCols','cRows','cTotal','cPct','cOver','cSide'].forEach(id=>$(id).textContent='—');$('summaryLine').textContent='Parâmetros incompatíveis.';current=null;}}\n  let t; Object.values(els).forEach(el=>el.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(safeCalc,80);}));\n  Object.values(els).forEach(el=>el.addEventListener('change',safeCalc));\n  $('recalc').addEventListener('click',safeCalc);\n  $('autoPct').addEventListener('click',()=>{els.PCT.value='';safeCalc();});\n  $('saveSvg').addEventListener('click',exportSvg);\n  $('saveCsv').addEventListener('click',exportCsv);\n  $('printBtn').addEventListener('click',()=>window.print());\n  $('resetBtn').addEventListener('click',()=>{els.W.value='600';els.H.value='250';els.M.value='15';els.G.value='15';els.D.value='75';els.PCT.value='';els.PMODE.value='circ';els.ALIGN.value='center';els.INTDIMS.checked=false;safeCalc();});\n  safeCalc();\n\nwindow.__precisionGrid={valid:()=>!!current, refresh:()=>safeCalc()};\n})();\n<\/script>\n<\/body>\n<\/html>\n"};
    const frames = Object.fromEntries([...document.querySelectorAll('iframe[data-engine]')].map(f=>[f.dataset.engine,f]));
    const subtabs = document.getElementById('subtabs');
    const toast = document.getElementById('toast');
    const categoryViews = {
      square:[['square-flex','Estúdio visual'],['square-detail','Ficha técnica']],
      saw:[['saw-edge','Recortes na borda'],['saw-grid','Malha paramétrica']]
    };
    const hints = {
      'square-flex':'Esquadro em L e rápido · projeto compacto com desenho SVG',
      'square-detail':'Dimensionamento, materiais, massa, alertas e critérios técnicos',
      'saw-edge':'Sequência de diâmetros diferentes · aberturas de borda e cotas acumuladas',
      'saw-grid':'Malha de furos · reservas, alinhamento, cotas e posição dos centros'
    };
    let category='square', activeView='square-flex', syncing=false, ready=new Set();
    function notice(message,error=false){
      toast.textContent=message;toast.className='toast visible'+(error?' error':'');
      clearTimeout(notice.timer);notice.timer=setTimeout(()=>toast.className='toast',4800);
    }
    function current(){return frames[activeView].contentDocument}
    function clickChild(selector){
      const btn=current()?.querySelector(selector);
      if(!btn){notice('Esta ação ainda não está disponível.',true);return false}
      btn.click();return true
    }
    function selectView(key){
      if(!frames[key])return;
      activeView=key;
      for(const [id,frame] of Object.entries(frames)){
        const chosen=id===key;frame.classList.toggle('active',chosen);frame.setAttribute('aria-hidden',String(!chosen))
      }
      document.querySelectorAll('.subtab').forEach(b=>{const yes=b.dataset.view===key;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});
      document.getElementById('viewHint').textContent=hints[key];
    }
    function selectCategory(cat){
      category=cat;
      document.querySelectorAll('.category').forEach(b=>{const yes=b.dataset.category===cat;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});
      subtabs.replaceChildren();
      for(const [id,label] of categoryViews[cat]){
        const button=document.createElement('button');button.type='button';button.className='subtab';button.textContent=label;button.dataset.view=id;
        button.onclick=()=>selectView(id);subtabs.appendChild(button);
      }
      selectView(categoryViews[cat][0][0]);
    }
    document.querySelectorAll('.category').forEach(b=>b.onclick=()=>selectCategory(b.dataset.category));
    document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>selectView(b.dataset.view));
    function fields(doc){
      const result={};
      for(const e of doc.querySelectorAll('input[id],select[id],textarea[id]')){
        if(['file','button','submit'].includes(e.type))continue;
        result[e.id]=e.type==='checkbox'?e.checked:e.value;
      }
      return result;
    }
    function applyFields(doc,saved){
      if(!saved||typeof saved!=='object')return;
      for(const [id,value] of Object.entries(saved)){
        const e=doc.getElementById(id);
        if(!e||!['INPUT','SELECT','TEXTAREA'].includes(e.tagName)||e.type==='file')continue;
        if(e.type==='checkbox')e.checked=!!value;
        else e.value=String(value);
      }
      for(const prefix of ['nInputLen','sSize','boardW','W']){
        const e=doc.getElementById(prefix);if(e)e.dispatchEvent(new Event('input',{bubbles:true}))
      }
      const recalc=doc.getElementById('recalc');if(recalc)recalc.click();
    }
    function syncSquares(from){
      if(syncing||!ready.has('square-flex')||!ready.has('square-detail'))return;
      syncing=true;
      try{
        const dest=from==='square-flex'?'square-detail':'square-flex';
        const source=frames[from].contentDocument, target=frames[dest].contentDocument;
        const s=fields(source);
        for(const [id,val] of Object.entries(s)){
          if(!/^[ns][A-Z]/.test(id))continue;
          const e=target.getElementById(id);if(!e)continue;
          if(e.type==='checkbox')e.checked=!!val;else e.value=String(val);
        }
        ['nInputLen','sSize'].forEach(id=>target.getElementById(id)?.dispatchEvent(new Event('input',{bubbles:true})));
      }finally{syncing=false}
    }
    for(const [id,iframe] of Object.entries(frames)){
      iframe.addEventListener('load',()=>{
        ready.add(id);
        if(id.startsWith('square')){
          ['input','change'].forEach(type=>iframe.contentDocument.addEventListener(type,()=>syncSquares(id),true));
          if(ready.has('square-flex')&&ready.has('square-detail'))syncSquares('square-flex');
        }
      });
      iframe.srcdoc=DOCUMENTS[id];
    }
    function childSquareMode(doc){
      if(activeView==='square-flex')return doc.querySelector('[data-mode].active')?.dataset.mode||'normal';
      return doc.querySelector('.tab.active[data-page]')?.dataset.page||'normal';
    }
    function saveBlob(name,mime,body){
      const url=URL.createObjectURL(new Blob([body],{type:mime}));
      const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
    }
    document.getElementById('exportSvg').onclick=()=>{
      const d=current();if(!d)return;
      if(activeView==='saw-edge'){
        if(!frames[activeView].contentWindow.__precisionEdge?.valid()){notice('A sequência não cabe na chapa. Ajuste as medidas antes de exportar.',true);return}
        const svg=d.getElementById('drawing');if(!svg||!svg.children.length){notice('Desenho indisponível.',true);return}
        const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
        saveBlob('croqui_recortes_borda.svg','image/svg+xml;charset=utf-8',new XMLSerializer().serializeToString(clone));
      }else if(activeView==='saw-grid'){clickChild('#saveSvg')}
      else{clickChild(childSquareMode(d)==='speed'?'#sSaveSvg':'#nSaveSvg')}
    };
    document.getElementById('exportData').onclick=()=>{
      const d=current();if(!d)return;
      if(activeView==='saw-edge'){
        if(!frames[activeView].contentWindow.__precisionEdge?.valid()){notice('Exportação bloqueada: os furos e reservas não cabem na chapa.',true);return}
        clickChild('#csvBtn');
      }else if(activeView==='saw-grid')clickChild('#saveCsv');
      else clickChild(childSquareMode(d)==='speed'?'#sSaveJson':'#nSaveJson');
    };
    document.getElementById('printView').onclick=()=>{
      if(activeView==='saw-edge'&&!frames[activeView].contentWindow.__precisionEdge?.valid()){notice('Corrija as dimensões para imprimir as cotas de fabricação.',true);return}
      frames[activeView].contentWindow?.focus();frames[activeView].contentWindow?.print();
    };
    function snapshot(){
      const engines={};
      for(const [id,frame] of Object.entries(frames)){
        const doc=frame.contentDocument;if(!doc)continue;
        const entry={fields:fields(doc)};
        if(id==='saw-edge')Object.assign(entry,frame.contentWindow.__precisionEdge?.snapshot()||{});
        engines[id]=entry;
      }
      return {format:'oficina-precisao-1',date:new Date().toISOString(),activeView,engines};
    }
    document.getElementById('saveProject').onclick=()=>saveBlob('oficina_precisao_projeto.json','application/json;charset=utf-8',JSON.stringify(snapshot(),null,2));
    const fileInput=document.getElementById('projectFile');
    document.getElementById('openProject').onclick=()=>fileInput.click();
    fileInput.onchange=async()=>{
      const file=fileInput.files?.[0];if(!file)return;
      try{
        const data=JSON.parse(await file.text());
        if(data?.format!=='oficina-precisao-1'||!data.engines||typeof data.engines!=='object'||!Object.keys(frames).every(id=>data.engines[id]?.fields&&typeof data.engines[id].fields==='object'))throw new Error('O arquivo não é um projeto compatível.');
        syncing=true;
        try{
          for(const [id,frame] of Object.entries(frames)){
            applyFields(frame.contentDocument,data.engines[id].fields);
            if(id==='saw-edge')frame.contentWindow.__precisionEdge?.restore(data.engines[id]);
            if(id==='saw-grid')frame.contentWindow.__precisionGrid?.refresh();
          }
        }finally{syncing=false}
        syncSquares('square-flex');
        const target=frames[data.activeView]?data.activeView:'square-flex';
        selectCategory(target.startsWith('square')?'square':'saw');selectView(target);
        notice('Projeto recuperado com sucesso.');
      }catch(err){notice('Não foi possível abrir: '+err.message,true)}
      fileInput.value='';
    };
    window.addEventListener('keydown',event=>{
      if((event.ctrlKey||event.metaKey)&&event.key==='s'){event.preventDefault();document.getElementById('saveProject').click()}
    });
  </script>
</body>
</html>
