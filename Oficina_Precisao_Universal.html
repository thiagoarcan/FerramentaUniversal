<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a22">
  <title>Oficina de Precisão — Projetista Universal</title>
  <style>
    :root{color-scheme:dark;--bg:#0d171f;--panel:#162630;--panel2:#1e3440;--stroke:#35515f;--text:#e8f3f4;--muted:#a4bac1;--accent:#50d1c2;--gold:#f5b862;--danger:#ff978e}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;height:100%;width:100%;overflow:hidden;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:focus-visible{outline:2px solid #fff;outline-offset:2px}
    .shell{height:100%;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0;overflow:hidden}
    .header{background:#111e27;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;min-width:0}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .mark{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(140deg,#2c827d,#2a4254);border:1px solid #5cb7aa;border-radius:12px;color:#f4fbf6;font-size:22px;font-weight:900;flex:none}
    .brand h1{margin:0;font-size:18px;letter-spacing:.015em;font-weight:790;line-height:1.2}
    .brand p{margin:2px 0 0;font-size:11px;color:var(--muted)}
    .righthead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .offline{font-weight:750;font-size:11px;color:#9df0bf;background:#194536;border:1px solid #367456;border-radius:100px;padding:6px 9px;white-space:nowrap}
    .headbtn,.action,.subtab,.category{background:var(--panel);border:1px solid var(--stroke);color:var(--text);border-radius:9px;min-height:38px;padding:7px 12px;font-weight:650}
    .headbtn:hover,.action:hover,.subtab:hover{background:#254350}
    .headbtn.important,.action.primary{background:#266b66;border-color:#4db5a8;color:white}
    .nav{display:flex;align-items:center;gap:14px;padding:9px 18px 10px;background:var(--panel);border-bottom:1px solid var(--stroke);min-width:0}
    .categories,.subtabs,.actions{display:flex;gap:7px;align-items:center;min-width:0}
    .category{min-height:43px;padding:9px 18px;font-size:14px;white-space:nowrap}
    .category.active{background:#285a59;border-color:#56baad;color:white}
    .subtabs{flex:1;overflow-x:auto;scrollbar-width:thin}
    .subtab{min-height:37px;font-size:12px;color:#b9d0d6;white-space:nowrap}
    .subtab.active{background:#324c58;border-color:#7ca9b0;color:white}
    .actions{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
    .action{min-height:36px;font-size:12px;white-space:nowrap}
    .workspace{min-width:0;min-height:0;position:relative;background:#0f1a22}
    .engine-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#102029;display:none}
    .engine-frame.active{display:block}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px;min-height:29px;background:#101e27;color:#a5bec6;border-top:1px solid var(--stroke);font-size:11px}
    .footer strong{color:var(--accent)}
    .toast{position:absolute;z-index:90;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(650px,94%);color:#f8fcfd;background:#174e49;border:1px solid #4bb9a9;border-radius:10px;padding:10px 16px;box-shadow:0 12px 35px #0008;font-size:13px;display:none}
    .toast.error{background:#5c2829;border-color:#df6b6b}
    .toast.visible{display:block}
    [hidden]{display:none!important}
    @media(max-width:1180px){
      .nav{flex-wrap:wrap;gap:8px}
      .categories{flex:1}
      .subtabs{flex:2}
      .actions{width:100%;margin-left:0;justify-content:flex-end}
    }
    @media(max-width:700px){
      .header{padding:8px 10px;gap:8px}
      .mark{width:35px;height:35px;font-size:20px;border-radius:9px}
      .brand{gap:7px}
      .brand h1{font-size:14px}
      .brand p{font-size:10px}
      .offline{display:none}
      .headbtn{padding:7px 9px;min-height:33px;font-size:11px}
      .nav{padding:7px 8px;gap:7px}
      .categories,.subtabs{width:100%;flex:auto}
      .category{flex:1;min-height:39px;text-align:center}
      .subtab{flex:1;font-size:11px;padding:5px 8px}
      .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:5px}
      .action{padding:6px 3px;font-size:10px;min-height:34px}
      .footer{padding:5px 9px;font-size:10px}
    }
    @media(max-width:380px){
      .brand p{display:none}
      .headbtn{padding:6px}
      .action{font-size:9px}
    }
    @media print{
      .header,.nav,.footer,.toast{display:none!important}
      html,body,.shell,.workspace{height:100%!important;overflow:visible!important;display:block!important}
      .engine-frame:not(.active){display:none!important}
      .engine-frame.active{display:block;position:static;width:100%;height:100vh}
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header class="header">
      <div class="brand">
        <div class="mark" aria-hidden="true">∟</div>
        <div><h1>OFICINA <span style="color:var(--accent)">DE PRECISÃO</span></h1><p>Projetista universal · Esquadros & serras-copo</p></div>
      </div>
      <div class="righthead">
        <span class="offline">● 100% offline</span>
        <button class="headbtn" id="openProject" title="Importar projeto JSON">Abrir projeto</button>
        <button class="headbtn important" id="saveProject">Salvar projeto</button>
        <input type="file" id="projectFile" accept=".json,application/json" hidden>
      </div>
    </header>
    <nav class="nav" aria-label="Ferramentas">
      <div class="categories">
        <button class="category active" data-category="square" aria-label="Esquadros" aria-pressed="true">▱ Esquadros</button>
        <button class="category" data-category="saw" aria-label="Serra-copo" aria-pressed="false">◎ Serra-copo</button>
      </div>
      <div class="subtabs" id="subtabs" aria-label="Modo de trabalho">
        <button class="subtab active" data-view="square-flex" aria-pressed="true">Estúdio visual</button>
        <button class="subtab" data-view="square-detail" aria-pressed="false">Ficha técnica</button>
      </div>
      <div class="actions">
        <button class="action primary" id="exportSvg">Exportar SVG</button>
        <button class="action" id="exportData">Exportar dados</button>
        <button class="action" id="printView">Imprimir / PDF</button>
      </div>
    </nav>
    <main class="workspace" id="workspace">
      <iframe class="engine-frame active" data-engine="square-flex" title="Esquadros: estúdio visual" loading="eager"></iframe>
      <iframe class="engine-frame" data-engine="square-detail" title="Esquadros: ficha técnica" loading="eager"></iframe>
      <iframe class="engine-frame" data-engine="saw-edge" title="Serra-copo: recortes ao longo da borda" loading="eager"></iframe>
      <iframe class="engine-frame" data-engine="saw-grid" title="Serra-copo: malha paramétrica" loading="eager"></iframe>
      <div class="toast" id="toast" role="alert" aria-live="assertive"></div>
    </main>
    <footer class="footer"><span id="viewHint">Esquadro em L ou rápido · parâmetros editáveis e desenho CNC</span><strong>mm · projeto local</strong></footer>
  </div>
  <script>
    const DOCUMENTS = {"square-flex": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5\">\n<meta name=\"theme-color\" content=\"#0c1418\">\n<title>Esquadros CNC — Oficina Universal · Estúdio visual<\/title>\n<style>\n:root{\n  --bg:#0c1418;--panel:#132127;--panel2:#1a2d35;--line:#35505b;\n  --text:#eef5f7;--muted:#96aeb7;--accent:#58ced3;--accent2:#f0a34a;\n  --good:#70d286;--warn:#f3c45a;--bad:#ef7373;\n  --safe-top:env(safe-area-inset-top,0px);\n  --safe-bottom:env(safe-area-inset-bottom,0px);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);\n  font-family:Inter,system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif;overscroll-behavior:none}\nbutton,input,select{font:inherit}\nbutton{touch-action:manipulation}\n#app{position:fixed;inset:0;display:grid;grid-template-rows:47dvh 53dvh;background:var(--bg);overflow:hidden}\n.pane{min-width:0;min-height:0;overflow:hidden}\n\n/* ---------- PREVIEW ---------- */\n#previewPane{position:relative;background:#f5f9fa;color:#16333b;border-bottom:1px solid #7a969f}\n.previewTopbar{\n  position:absolute;z-index:8;left:6px;right:6px;top:calc(5px + var(--safe-top));\n  height:34px;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:5px;\n}\n.iconBtn,.modePill,.tinyBtn{\n  height:32px;border:1px solid rgba(20,58,68,.25);border-radius:9px;background:rgba(255,255,255,.90);\n  color:#173b45;padding:0 10px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08)\n}\n.modePill{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.statusDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8a9da3;margin-right:5px}\n.statusDot.flex{background:#27a95c}\n#previewSvg{position:absolute;inset:0;width:100%;height:100%;display:block}\n.previewStats{\n  position:absolute;z-index:8;left:6px;right:6px;bottom:6px;\n  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;pointer-events:none\n}\n.stat{\n  min-width:0;background:rgba(13,27,32,.86);color:#f2f8fa;border:1px solid rgba(255,255,255,.10);\n  border-radius:9px;padding:5px 6px;text-align:center;backdrop-filter:blur(5px)\n}\n.stat b{display:block;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.stat span{font-size:8.5px;color:#b9ccd2;letter-spacing:.02em}\n.previewHint{\n  position:absolute;z-index:7;left:50%;transform:translateX(-50%);top:43px;\n  background:rgba(255,255,255,.82);border-radius:8px;padding:3px 8px;font-size:10px;color:#536d75\n}\n\n/* ---------- CONTROLS ---------- */\n#controlPane{\n  background:var(--bg);padding:5px 6px calc(6px + var(--safe-bottom));\n  display:grid;grid-template-rows:36px 34px 1fr 30px;gap:5px\n}\n.mainTabs,.subTabs{display:grid;gap:5px}\n.mainTabs{grid-template-columns:1fr 1fr 36px}\n.subTabs{grid-template-columns:repeat(3,1fr)}\n.tabBtn{\n  min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;\n  font-size:12px;font-weight:800;padding:0 7px\n}\n.tabBtn.active{background:var(--panel2);color:var(--accent);border-color:#4b727e}\n#criteriaBtn{font-size:17px}\n.panels{position:relative;min-height:0;overflow:hidden}\n.controlPanel{\n  position:absolute;inset:0;display:none;background:var(--panel);border:1px solid var(--line);\n  border-radius:11px;padding:6px;overflow:hidden\n}\n.controlPanel.active{display:block}\n.formGrid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:5px}\n.field{min-width:0;min-height:0;background:#101b20;border:1px solid #2b424b;border-radius:8px;padding:4px 5px;display:flex;flex-direction:column;justify-content:center}\n.field.full{grid-column:1/-1}\n.field label{display:block;color:var(--muted);font-size:9.5px;line-height:1.05;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\ninput,select{\n  width:100%;min-width:0;height:30px;border:1px solid #36525d;background:#0d171c;color:var(--text);\n  border-radius:7px;padding:2px 7px;font-size:12px\n}\ninput[type=range]{height:22px;padding:0;accent-color:var(--accent)}\n.rangeLine{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}\n.rangeVal{font-size:11px;font-weight:800;color:var(--accent);min-width:46px;text-align:right}\n.checkLine{display:flex;align-items:center;gap:7px;height:30px}\n.checkLine input{width:18px;height:18px}\n.metricGrid{height:100%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:5px}\n.metric{\n  border:1px solid #2d4852;border-radius:8px;background:#0f1b20;padding:5px;display:flex;flex-direction:column;justify-content:center;text-align:center\n}\n.metric .v{font-size:16px;font-weight:900;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.metric .l{font-size:9px;color:var(--muted)}\n.actionGrid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px}\n.actionBtn{\n  border:1px solid #42636e;border-radius:9px;background:#17313a;color:var(--text);font-weight:800;font-size:12px\n}\n.actionBtn.primary{background:#1e6871;color:white}\n.footerLine{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;color:var(--muted);font-size:9px;padding:0 3px}\n#alertText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n#foldState{color:#c6d9df}\n\n/* ---------- CRITERIA MODAL ---------- */\n#criteriaModal{position:fixed;inset:0;z-index:50;background:rgba(4,9,11,.94);display:none;padding:8px}\n#criteriaModal.open{display:grid;grid-template-rows:38px 1fr 38px;gap:6px}\n.modalHead,.modalFoot{display:grid;align-items:center;gap:6px}\n.modalHead{grid-template-columns:1fr auto}\n.modalFoot{grid-template-columns:auto 1fr auto}\n.modalHead button,.modalFoot button{\n  height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:0 12px;font-weight:800\n}\n.criterionPage{display:none;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}\n.criterionPage.active{display:block}\n.criterionPage h3{margin:0 0 8px;color:var(--accent);font-size:15px}\n.criterionPage p,.criterionPage li{font-size:11px;line-height:1.42;color:#c8d7dc}\n.criterionPage ul{margin:7px 0;padding-left:18px}\n.criterionPage a{color:var(--accent)}\n\n/* ---------- FOLDABLE / FLEX MODE ---------- */\n/* Standards-based exact two-segment layout when the browser exposes viewport segments. */\n\n/* Fallback when posture is detectable but segment geometry is not exposed. */\n\n\n\n/* Landscape: preview left, controls right, still no page scroll. */\n@media (orientation:landscape) and (max-height:650px){\n  #app{grid-template-rows:1fr;grid-template-columns:48vw 52vw}\n  #previewPane{border-bottom:0;border-right:1px solid #7a969f}\n  #controlPane{grid-template-rows:34px 32px 1fr 26px}\n  .previewStats{grid-template-columns:repeat(2,1fr);width:48%;left:auto}\n}\n\n/* Very small CSS viewport: compact further instead of scrolling. */\n@media (max-height:720px){\n  #controlPane{grid-template-rows:32px 30px 1fr 24px;gap:4px}\n  .tabBtn{font-size:10.5px}\n  .field{padding:3px 4px}\n  input,select{height:27px;font-size:11px}\n  .field label{font-size:8.7px}\n  .previewTopbar{height:30px}.iconBtn,.modePill,.tinyBtn{height:29px;font-size:11px}\n  .previewHint{top:39px}\n}\n<\/style>\n\n<style>\n/* Standard responsive monitor/tablet/phone behavior, without hinge adaptation. */\nhtml,body{touch-action:pan-x pan-y}\n#app{grid-template-columns:1fr;grid-template-rows:minmax(220px,45%) minmax(0,55%);}\n#controlPane .controlPanel{overflow:auto}\n#controlPane .formGrid{grid-auto-rows:minmax(60px,auto)}\n@media(min-width:900px){\n  #app{grid-template-columns:minmax(0,56%) minmax(360px,44%);grid-template-rows:1fr}\n  #previewPane{border-bottom:0;border-right:1px solid #7a969f}\n  #controlPane{grid-template-rows:36px 34px 1fr 30px}\n}\n@media(max-width:599px){\n  #app{grid-template-rows:minmax(185px,39%) minmax(0,61%)}\n  .previewStats{grid-template-columns:repeat(4,minmax(0,1fr))}\n  .stat b{font-size:11px}\n  #controlPane{grid-template-rows:34px 31px 1fr 27px;gap:4px}\n}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n  <section id=\"previewPane\" class=\"pane\">\n    <div class=\"previewTopbar\">\n      <button class=\"iconBtn\" id=\"fullscreenBtn\" title=\"Tela cheia\">⛶<\/button>\n      <button class=\"modePill\" id=\"previewModeLabel\">Esquadro em L<\/button>\n      <button class=\"tinyBtn\" id=\"zoomFitBtn\">Ajustar<\/button>\n      <button class=\"tinyBtn\" id=\"swapPaneBtn\" title=\"Inverter painéis\">⇅<\/button>\n    <\/div>\n    <div class=\"previewHint\"><span class=\"statusDot\" id=\"statusDot\"><\/span><span id=\"postureText\">Modo contínuo<\/span><\/div>\n    <svg id=\"previewSvg\" viewBox=\"0 0 900 580\" preserveAspectRatio=\"xMidYMid meet\"><\/svg>\n    <div class=\"previewStats\">\n      <div class=\"stat\"><b id=\"ps1\">–<\/b><span id=\"ps1l\">lado menor<\/span><\/div>\n      <div class=\"stat\"><b id=\"ps2\">–<\/b><span id=\"ps2l\">lado maior<\/span><\/div>\n      <div class=\"stat\"><b id=\"ps3\">–<\/b><span id=\"ps3l\">espessura<\/span><\/div>\n      <div class=\"stat\"><b id=\"ps4\">–<\/b><span id=\"ps4l\">peso<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"controlPane\" class=\"pane\">\n    <div class=\"mainTabs\">\n      <button class=\"tabBtn active\" data-mode=\"normal\">Esquadro em L<\/button>\n      <button class=\"tabBtn\" data-mode=\"speed\">Esquadro rápido<\/button>\n      <button class=\"tabBtn\" id=\"criteriaBtn\" title=\"Critérios e fontes\">ⓘ<\/button>\n    <\/div>\n\n    <div class=\"subTabs\" id=\"normalSubTabs\">\n      <button class=\"tabBtn active\" data-panel=\"n-geo\">Geometria<\/button>\n      <button class=\"tabBtn\" data-panel=\"n-mat\">Material<\/button>\n      <button class=\"tabBtn\" data-panel=\"n-hole\">Furos / Saída<\/button>\n    <\/div>\n    <div class=\"subTabs\" id=\"speedSubTabs\" style=\"display:none\">\n      <button class=\"tabBtn active\" data-panel=\"s-geo\">Geometria<\/button>\n      <button class=\"tabBtn\" data-panel=\"s-mat\">Material<\/button>\n      <button class=\"tabBtn\" data-panel=\"s-mark\">Escalas / Saída<\/button>\n    <\/div>\n\n    <div class=\"panels\">\n      <!-- NORMAL: GEO -->\n      <div class=\"controlPanel active\" id=\"n-geo\">\n        <div class=\"formGrid\">\n          <div class=\"field\">\n            <label>Lado informado<\/label>\n            <select id=\"nInputSide\">\n              <option value=\"short\">Menor<\/option>\n              <option value=\"long\">Maior<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Medida (mm)<\/label>\n            <input id=\"nInputLen\" type=\"number\" min=\"100\" max=\"3000\" step=\"1\" value=\"500\">\n          <\/div>\n          <div class=\"field\">\n            <label>Proporção<\/label>\n            <select id=\"nRatio\">\n              <option value=\"1.5\">1 : 1,5<\/option>\n              <option value=\"2\">1 : 2<\/option>\n              <option value=\"1.5\">2 : 3 (= 1 : 1,5)<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Largura do braço<\/label>\n            <div class=\"rangeLine\">\n              <input id=\"nWidthPct\" type=\"range\" min=\"8\" max=\"12\" step=\"0.1\" value=\"10\">\n              <span class=\"rangeVal\" id=\"nWidthPctTxt\">10%<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"field\">\n            <label>Espessura<\/label>\n            <select id=\"nThicknessMode\">\n              <option value=\"auto\">Automática<\/option>\n              <option value=\"manual\">Manual<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Espessura manual (mm)<\/label>\n            <input id=\"nManualThk\" type=\"number\" min=\"2\" max=\"50\" step=\"0.5\" value=\"10\" disabled>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- NORMAL: MATERIAL -->\n      <div class=\"controlPanel\" id=\"n-mat\">\n        <div class=\"formGrid\">\n          <div class=\"field\">\n            <label>Material<\/label>\n            <select id=\"nMaterial\">\n              <option value=\"7075\">Alumínio 7075-T6/T651<\/option>\n              <option value=\"6061\">Alumínio 6061-T6<\/option>\n              <option value=\"304\">Inox 304<\/option>\n              <option value=\"316\">Inox 316<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Robustez<\/label>\n            <select id=\"nRobust\">\n              <option value=\"0.8\">Leve<\/option>\n              <option value=\"1\" selected>Oficina robusto<\/option>\n              <option value=\"1.2\">Impacto severo<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field full\" style=\"padding:0;border:0;background:transparent\">\n            <div class=\"metricGrid\">\n              <div class=\"metric\"><div class=\"v\" id=\"nGross\">–<\/div><div class=\"l\">peso bruto<\/div><\/div>\n              <div class=\"metric\"><div class=\"v\" id=\"nNet\">–<\/div><div class=\"l\">peso final<\/div><\/div>\n              <div class=\"metric\"><div class=\"v\" id=\"nReduction\">–<\/div><div class=\"l\">redução<\/div><\/div>\n              <div class=\"metric\"><div class=\"v\" id=\"nProps\">–<\/div><div class=\"l\">E / σy<\/div><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- NORMAL: HOLES -->\n      <div class=\"controlPanel\" id=\"n-hole\">\n        <div class=\"formGrid\">\n          <div class=\"field\">\n            <label>Furação<\/label>\n            <select id=\"nHoleMode\">\n              <option value=\"functional\">Fixação / traçagem<\/option>\n              <option value=\"relief\">Alívio leve<\/option>\n              <option value=\"none\">Sem furos<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Resultado dos furos<\/label>\n            <div id=\"nHoleResult\" style=\"font-size:12px;font-weight:800;color:var(--accent)\">–<\/div>\n          <\/div>\n          <div class=\"field full\" style=\"padding:0;border:0;background:transparent\">\n            <div class=\"actionGrid\">\n              <button class=\"actionBtn primary\" id=\"nSaveSvg\">Salvar SVG<\/button>\n              <button class=\"actionBtn\" id=\"nSaveJson\">Salvar JSON<\/button>\n              <button class=\"actionBtn\" id=\"nPrint\">Imprimir<\/button>\n              <button class=\"actionBtn\" id=\"nReset\">Padrão<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- SPEED: GEO -->\n      <div class=\"controlPanel\" id=\"s-geo\">\n        <div class=\"formGrid\">\n          <div class=\"field\">\n            <label>Cateto nominal (mm)<\/label>\n            <input id=\"sSize\" type=\"number\" min=\"120\" max=\"600\" step=\"1\" value=\"250\">\n          <\/div>\n          <div class=\"field\">\n            <label>Corpo<\/label>\n            <select id=\"sBody\">\n              <option value=\"frame\">Vazado estrutural<\/option>\n              <option value=\"solid\">Sólido<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Largura estrutural<\/label>\n            <div class=\"rangeLine\">\n              <input id=\"sFramePct\" type=\"range\" min=\"10\" max=\"20\" step=\"0.5\" value=\"14\">\n              <span class=\"rangeVal\" id=\"sFramePctTxt\">14%<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"field\">\n            <label>Aba-guia<\/label>\n            <div class=\"rangeLine\">\n              <input id=\"sFencePct\" type=\"range\" min=\"6\" max=\"14\" step=\"0.5\" value=\"9\">\n              <span class=\"rangeVal\" id=\"sFencePctTxt\">9%<\/span>\n            <\/div>\n          <\/div>\n          <div class=\"field full\">\n            <label>Geometria automática<\/label>\n            <div style=\"font-size:12px;font-weight:800;color:var(--accent)\" id=\"sGeoResult\">45° / 45° / 90°<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- SPEED: MATERIAL -->\n      <div class=\"controlPanel\" id=\"s-mat\">\n        <div class=\"formGrid\">\n          <div class=\"field\">\n            <label>Material<\/label>\n            <select id=\"sMaterial\">\n              <option value=\"7075\">Alumínio 7075-T6/T651<\/option>\n              <option value=\"6061\">Alumínio 6061-T6<\/option>\n              <option value=\"304\">Inox 304<\/option>\n              <option value=\"316\">Inox 316<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Robustez<\/label>\n            <select id=\"sRobust\">\n              <option value=\"0.8\">Leve<\/option>\n              <option value=\"1\" selected>Oficina robusto<\/option>\n              <option value=\"1.2\">Impacto severo<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field full\" style=\"padding:0;border:0;background:transparent\">\n            <div class=\"metricGrid\">\n              <div class=\"metric\"><div class=\"v\" id=\"sGross\">–<\/div><div class=\"l\">peso bruto<\/div><\/div>\n              <div class=\"metric\"><div class=\"v\" id=\"sNet\">–<\/div><div class=\"l\">peso final<\/div><\/div>\n              <div class=\"metric\"><div class=\"v\" id=\"sReduction\">–<\/div><div class=\"l\">redução<\/div><\/div>\n              <div class=\"metric\"><div class=\"v\" id=\"sProps\">–<\/div><div class=\"l\">espessura / material<\/div><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- SPEED: MARK -->\n      <div class=\"controlPanel\" id=\"s-mark\">\n        <div class=\"formGrid\">\n          <div class=\"field\">\n            <label>Marcas de traçagem<\/label>\n            <select id=\"sScribe\">\n              <option value=\"5\">a cada 5 mm<\/option>\n              <option value=\"10\">a cada 10 mm<\/option>\n              <option value=\"0\">sem marcas<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Inclinação r/12<\/label>\n            <div class=\"checkLine\"><input type=\"checkbox\" id=\"sShowPitch\" checked><span style=\"font-size:11px\">Mostrar escala<\/span><\/div>\n          <\/div>\n          <div class=\"field full\" style=\"padding:0;border:0;background:transparent\">\n            <div class=\"actionGrid\">\n              <button class=\"actionBtn primary\" id=\"sSaveSvg\">Salvar SVG<\/button>\n              <button class=\"actionBtn\" id=\"sSaveJson\">Salvar JSON<\/button>\n              <button class=\"actionBtn\" id=\"sPitchTable\">Tabela r/12<\/button>\n              <button class=\"actionBtn\" id=\"sReset\">Padrão<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footerLine\">\n      <div id=\"alertText\">Pronto.<\/div>\n      <div id=\"foldState\">Tela única<\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<!-- Criteria / help modal, paginated: no page scrolling -->\n<div id=\"criteriaModal\">\n  <div class=\"modalHead\">\n    <strong>Critérios e fontes<\/strong>\n    <button id=\"closeCriteria\">Fechar<\/button>\n  <\/div>\n  <div>\n    <div class=\"criterionPage active\" data-cp=\"0\">\n      <h3>Dimensionamento<\/h3>\n      <p><b>Proporções:<\/b> o configurador oferece 1:1,5, 1:2 e 2:3. Note que 1:1,5 e 2:3 são matematicamente equivalentes.<\/p>\n      <p><b>Largura dos braços:<\/b> 8% a 12% do lado menor é tratada como heurística de projeto, não como exigência normativa.<\/p>\n      <p><b>Espessura:<\/b> a recomendação combina uma equivalência de rigidez em flexão, proporcional a E·t³, e uma verificação simplificada de resistência à plastificação em flexão, proporcional a σy·t².<\/p>\n    <\/div>\n    <div class=\"criterionPage\" data-cp=\"1\">\n      <h3>Peso e furação<\/h3>\n      <p><b>Peso:<\/b> massa = área plana × espessura × densidade. No esquadro em L, os furos são descontados. No rápido vazado, o vazio triangular interno é descontado.<\/p>\n      <p><b>Furos:<\/b> o algoritmo preserva zona sem furos junto ao vértice de 90°, afastamento de bordas e espaçamento mínimo. Grandes vazados exigem análise estrutural específica.<\/p>\n      <p><b>Impacto:<\/b> queda e esmagamento são eventos dinâmicos; a espessura sugerida não é garantia contra qualquer impacto.<\/p>\n    <\/div>\n    <div class=\"criterionPage\" data-cp=\"2\">\n      <h3>Esquadro rápido<\/h3>\n      <p>A geometria-base é um triângulo retângulo isósceles 45°–45°–90°. A inclinação de telhado r/12 é calculada diretamente por θ = atan(r/12).<\/p>\n      <p>O aplicativo não copia tabelas proprietárias de fabricantes; calcula os valores por trigonometria.<\/p>\n      <p>A aba-guia mostrada é uma aproximação em planta. A massa real depende de ser usinada como degrau, dobrada ou fixada como peça separada.<\/p>\n    <\/div>\n    <div class=\"criterionPage\" data-cp=\"3\">\n      <h3>Normas e referências<\/h3>\n      <ul>\n        <li>W3C Device Posture API — estado <i>continuous/folded<\/i>.<\/li>\n        <li>W3C Media Queries Level 5 — viewport segments.<\/li>\n        <li>DIN Media — série DIN 875 para esquadros de 90°.<\/li>\n        <li>ASM/MatWeb — propriedades de Al 6061-T6 e 7075-T6.<\/li>\n        <li>Swanson Tool — fundamentos de rafter/speed square.<\/li>\n      <\/ul>\n      <p>Precisão final deve ser verificada metrologicamente após usinagem e acabamento.<\/p>\n    <\/div>\n    <div class=\"criterionPage\" data-cp=\"4\">\n      <h3>Tabela de inclinação r/12<\/h3>\n      <div id=\"pitchMiniTable\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:10px\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"modalFoot\">\n    <button id=\"prevCriteria\">◀<\/button>\n    <div id=\"criteriaPageLabel\" style=\"text-align:center;color:var(--muted);font-size:11px\">1 / 5<\/div>\n    <button id=\"nextCriteria\">▶<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst NS=\"http://www.w3.org/2000/svg\";\nconst MAT={\n  \"7075\":{name:\"Al 7075-T6/T651\",rho:2.81,E:71.7,y:503},\n  \"6061\":{name:\"Al 6061-T6\",rho:2.70,E:68.9,y:276},\n  \"304\":{name:\"Inox 304\",rho:8.00,E:193,y:230},\n  \"316\":{name:\"Inox 316\",rho:8.00,E:193,y:205}\n};\nconst STOCK=[3,4,5,6,8,10,12,15,16,20,25,30];\nconst $=id=>document.getElementById(id);\nconst fmt=(x,d=0)=>Number(x).toLocaleString(\"pt-BR\",{minimumFractionDigits:d,maximumFractionDigits:d});\nconst clamp=(x,a,b)=>Math.min(b,Math.max(a,x));\nfunction roundStock(x){for(const s of STOCK)if(s>=x)return s;return Math.ceil(x/5)*5}\nfunction svgEl(tag,attrs={},text=\"\"){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}\nfunction download(name,type,text){const a=document.createElement(\"a\");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},150)}\nfunction exportSvg(name){const s=$(\"previewSvg\").cloneNode(true);s.setAttribute(\"xmlns\",NS);download(name,\"image/svg+xml;charset=utf-8\",new XMLSerializer().serializeToString(s))}\nfunction baseThickness7075(L,kind){return kind===\"speed\"?clamp(L/45,5,10):clamp(L/60,6,16)}\nfunction suggestedThickness(L,matKey,robust,kind){\n  const m=MAT[matKey],ref=MAT[\"7075\"],tr=baseThickness7075(L,kind)*robust;\n  const tStiff=tr*Math.cbrt(ref.E/m.E), tYield=.75*tr*Math.sqrt(ref.y/m.y);\n  const raw=Math.max(tStiff,tYield,kind===\"speed\"?4:5);\n  return {raw,stock:roundStock(raw),tStiff,tYield}\n}\nfunction addDefs(svg){\n  const defs=svgEl(\"defs\");\n  const marker=svgEl(\"marker\",{id:\"arr\",markerWidth:\"9\",markerHeight:\"9\",refX:\"4.5\",refY:\"4.5\",orient:\"auto-start-reverse\"});\n  marker.appendChild(svgEl(\"path\",{d:\"M0 0 L9 4.5 L0 9 Z\",fill:\"#3477c7\"}));defs.appendChild(marker);svg.appendChild(defs)\n}\nfunction addDim(svg,x1,y1,x2,y2,label,tx,ty,rot=0){\n  svg.appendChild(svgEl(\"line\",{x1,y1,x2,y2,stroke:\"#3477c7\",\"stroke-width\":\"2\",\"marker-start\":\"url(#arr)\",\"marker-end\":\"url(#arr)\"}));\n  const t=svgEl(\"text\",{x:tx,y:ty,fill:\"#174f97\",\"font-size\":\"22\",\"font-weight\":\"800\",\"text-anchor\":\"middle\",\"paint-order\":\"stroke\",\"stroke\":\"#f5f9fa\",\"stroke-width\":\"4\"},label);\n  if(rot)t.setAttribute(\"transform\",`rotate(${rot} ${tx} ${ty})`);svg.appendChild(t)\n}\n\nlet mode=\"normal\", activeNormal=\"n-geo\", activeSpeed=\"s-geo\", swapped=false;\n\nfunction calcNormal(){\n  const input=Math.max(1,+$(\"nInputLen\").value||500),r=+$(\"nRatio\").value;\n  let short=input,long=input*r;if($(\"nInputSide\").value===\"long\"){long=input;short=input/r}\n  const wp=+$(\"nWidthPct\").value,w=short*wp/100,matKey=$(\"nMaterial\").value,m=MAT[matKey],rob=+$(\"nRobust\").value;\n  const th=suggestedThickness(short,matKey,rob,\"normal\");\n  const t=$(\"nThicknessMode\").value===\"manual\"?Math.max(2,+$(\"nManualThk\").value||th.stock):th.stock;\n  const hm=$(\"nHoleMode\").value;let d=0,pitch=0,corner=0,end=0;\n  if(hm===\"functional\"){d=clamp(w*.18,6,14);pitch=Math.max(2.5*w,4*d,100);corner=Math.max(1.25*w,3*d);end=Math.max(.8*w,3*d)}\n  if(hm===\"relief\"){d=clamp(w*.45,12,40);pitch=Math.max(1.85*w,3*d);corner=Math.max(1.6*w,3.5*d);end=Math.max(w,3*d)}\n  function pos(L){if(hm===\"none\")return[];const u=L-corner-end;if(u<=0)return[];const n=Math.max(1,Math.floor(u/pitch)+1);return n===1?[corner+u/2]:Array.from({length:n},(_,i)=>corner+i*u/(n-1))}\n  const hx=pos(long),hy=pos(short),grossArea=long*w+short*w-w*w,holeArea=(hx.length+hy.length)*Math.PI*d*d/4;\n  const area=Math.max(0,grossArea-holeArea),grossMass=grossArea*t*m.rho/1e6,mass=area*t*m.rho/1e6,red=grossMass?100*(grossMass-mass)/grossMass:0;\n  return{short,long,w,wp,matKey,m,rob,th,t,hm,d,hx,hy,grossMass,mass,red}\n}\nfunction calcSpeed(){\n  const A=Math.max(80,+$(\"sSize\").value||250),matKey=$(\"sMaterial\").value,m=MAT[matKey],rob=+$(\"sRobust\").value;\n  const th=suggestedThickness(A,matKey,rob,\"speed\"),t=th.stock,fp=+$(\"sFramePct\").value,w=A*fp/100,fence=A*(+$(\"sFencePct\").value)/100,body=$(\"sBody\").value;\n  const outer=A*A/2,innerLeg=Math.max(0,A-w*(2+Math.SQRT2)),inner=body===\"frame\"?innerLeg*innerLeg/2:0,fenceArea=A*fence*.35;\n  const grossArea=outer+fenceArea,area=outer-inner+fenceArea,grossMass=grossArea*t*m.rho/1e6,mass=area*t*m.rho/1e6,red=grossMass?100*(grossMass-mass)/grossMass:0;\n  return{A,hyp:A*Math.SQRT2,matKey,m,rob,th,t,fp,w,fence,body,innerLeg,grossMass,mass,red}\n}\n\nfunction drawNormal(o){\n  const svg=$(\"previewSvg\");svg.innerHTML=\"\";addDefs(svg);\n  const W=900,H=580,padX=100,padTop=80,padBottom=90;\n  const s=Math.min((W-2*padX)/o.long,(H-padTop-padBottom)/o.short),ox=padX,oy=padTop,L=o.long*s,S=o.short*s,w=o.w*s;\n  const path=`M${ox},${oy} H${ox+L} V${oy+w} H${ox+w} V${oy+S} H${ox} Z`;\n  svg.appendChild(svgEl(\"path\",{d:path,fill:\"#2d7d8e\",stroke:\"#0d4a55\",\"stroke-width\":\"3\"}));\n  if(o.hm!==\"none\"){\n    o.hx.forEach(x=>svg.appendChild(svgEl(\"circle\",{cx:ox+x*s,cy:oy+w/2,r:o.d*s/2,fill:\"#f5f9fa\",stroke:\"#df8f35\",\"stroke-width\":\"3\"})));\n    o.hy.forEach(y=>svg.appendChild(svgEl(\"circle\",{cx:ox+w/2,cy:oy+y*s,r:o.d*s/2,fill:\"#f5f9fa\",stroke:\"#df8f35\",\"stroke-width\":\"3\"})));\n  }\n  const q=Math.min(36,w*.55);svg.appendChild(svgEl(\"path\",{d:`M${ox+w+8},${oy+w+q} H${ox+w+q} V${oy+w+8}`,fill:\"none\",stroke:\"#f0a34a\",\"stroke-width\":\"3\"}));\n  addDim(svg,ox,oy-35,ox+L,oy-35,`${fmt(o.long)} mm`,ox+L/2,oy-50);\n  addDim(svg,ox-38,oy,ox-38,oy+S,`${fmt(o.short)} mm`,ox-58,oy+S/2,-90);\n  addDim(svg,ox+L*.72,oy+4,ox+L*.72,oy+w-4,`${fmt(o.w,1)} mm`,ox+L*.72+55,oy+w/2+7);\n  svg.appendChild(svgEl(\"text\",{x:W-18,y:H-20,fill:\"#536d75\",\"font-size\":\"18\",\"text-anchor\":\"end\"},`${o.m.name} • t=${fmt(o.t,1)} mm • ${fmt(o.mass,2)} kg`));\n}\nfunction polar(cx,cy,r,deg){const a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy-r*Math.sin(a)]}\nfunction drawSpeed(o){\n  const svg=$(\"previewSvg\");svg.innerHTML=\"\";addDefs(svg);\n  const W=900,H=580,pad=95,s=Math.min((W-2*pad)/o.A,(H-2*pad)/o.A),A=o.A*s,ox=pad,oy=H-pad;\n  svg.appendChild(svgEl(\"path\",{d:`M${ox},${oy} L${ox+A},${oy} L${ox},${oy-A} Z`,fill:\"#2d7d8e\",stroke:\"#0d4a55\",\"stroke-width\":\"3\"}));\n  if(o.body===\"frame\"&&o.innerLeg>0){\n    const w=o.w*s,q0=[ox+w,oy-w],q1=[ox+(o.A-o.w*(1+Math.SQRT2))*s,oy-w],q2=[ox+w,oy-(o.A-o.w*(1+Math.SQRT2))*s];\n    svg.appendChild(svgEl(\"path\",{d:`M${q0[0]},${q0[1]} L${q1[0]},${q1[1]} L${q2[0]},${q2[1]} Z`,fill:\"#f5f9fa\",stroke:\"#0d4a55\",\"stroke-width\":\"2\"}));\n  }\n  const fw=Math.min(o.fence*s,36);svg.appendChild(svgEl(\"rect\",{x:ox-fw,y:oy-A,width:fw,height:A,fill:\"#75aeb8\",stroke:\"#0d4a55\",\"stroke-width\":\"2\"}));\n  const step=+$(\"sScribe\").value;if(step>0)for(let mm=step;mm<o.A;mm+=step){const x=ox+mm*s,len=mm%(step*5)===0?17:9;svg.appendChild(svgEl(\"line\",{x1:x,y1:oy,x2:x,y2:oy-len,stroke:\"#e8f4f6\",\"stroke-width\":\"1.5\"}))}\n  const rc=Math.min(A*.45,220);\n  for(let deg=5;deg<=85;deg+=5){const a=polar(ox,oy,rc-(deg%15===0?18:10),deg),b=polar(ox,oy,rc,deg);svg.appendChild(svgEl(\"line\",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:\"#f7dfbd\",\"stroke-width\":deg%15===0?3:1.5}));if(deg%15===0){const t=polar(ox,oy,rc-34,deg);svg.appendChild(svgEl(\"text\",{x:t[0],y:t[1]+5,fill:\"#73470f\",\"font-size\":\"16\",\"text-anchor\":\"middle\"},deg+\"°\"))}}\n  if($(\"sShowPitch\").checked)for(let rise=1;rise<=12;rise++){const deg=Math.atan(rise/12)*180/Math.PI,p=polar(ox,oy,rc-54,deg);svg.appendChild(svgEl(\"circle\",{cx: ;$(\"sNet\").textContent=fmt(o.mass,2)+\" kg\";$(\"sReduction\").textContent=fmt(o.red,1)+\"%\";$(\"sProps\").textContent=`${fmt(o.t,1)} mm • ${o.m.name}`;\n  $(\"sGeoResult\").textContent=`Hipotenusa ${fmt(o.hyp,1)} mm • 45°/45°/90°`;\n  if(mode===\"speed\"){\n    $(\"ps1\").textContent=fmt(o.A)+\" mm\";$(\"ps1l\").textContent=\"cateto\";\n    $(\"ps2\").textContent=fmt(o.hyp,1)+\" mm\";$(\"ps2l\").textContent=\"hipotenusa\";\n    $(\"ps3\").textContent=fmt(o.t,1)+\" mm\";$(\"ps3l\").textContent=\"espessura\";\n    $(\"ps4\").textContent=fmt(o.mass,2)+\" kg\";$(\"ps4l\").textContent=\"peso final\";\n    drawSpeed(o);$(\"alertText\").textContent=o.body===\"frame\"&&o.innerLeg<=0?\"Reduza a largura estrutural: o vazio interno desapareceu.\":\"Triângulo 45°–45°–90° calculado.\";\n  }\n  saveState();\n}\nfunction updateAll(){updateNormal();updateSpeed()}\n\nfunction setMode(m){\n  mode=m;\n  document.querySelectorAll(\"[data-mode]\").forEach(b=>b.classList.toggle(\"active\",b.dataset.mode===m));\n  $(\"normalSubTabs\").style.display=m===\"normal\"?\"grid\":\"none\";$(\"speedSubTabs\").style.display=m===\"speed\"?\"grid\":\"none\";\n  $(\"previewModeLabel\").textContent=m===\"normal\"?\"Esquadro em L\":\"Esquadro rápido\";\n  showPanel(m===\"normal\"?activeNormal:activeSpeed);updateAll();\n}\nfunction showPanel(id){\n  document.querySelectorAll(\".controlPanel\").forEach(p=>p.classList.remove(\"active\"));$(id).classList.add(\"active\");\n  const holder=id.startsWith(\"n-\")?$(\"normalSubTabs\"):$(\"speedSubTabs\");\n  holder.querySelectorAll(\"[data-panel]\").forEach(b=>b.classList.toggle(\"active\",b.dataset.panel===id));\n  if(id.startsWith(\"n-\"))activeNormal=id;else activeSpeed=id;\n}\ndocument.querySelectorAll(\"[data-mode]\").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));\ndocument.querySelectorAll(\"[data-panel]\").forEach(b=>b.onclick=()=>showPanel(b.dataset.panel));\n\nconst normalIds=[\"nInputSide\",\"nInputLen\",\"nRatio\",\"nWidthPct\",\"nThicknessMode .touchbar{display:none}\n@media(max-width:700px){\n  body{padding-bottom:84px}\n  header{padding:14px 12px 8px}\n  h1{font-size:22px}\n  .sub{font-size:12px}\n  .tabs{padding:8px 8px 0;gap:6px}\n  .tab{padding:10px 11px;font-size:13px}\n  .page{padding:8px}\n  .card{border-radius:12px;padding:10px}\n  .card h2{font-size:18px}.card h3{font-size:16px}\n  input,select,button{min-height:46px;font-size:16px}\n  input[type=range]{min-height:34px}\n  label{font-size:13px}\n  .row{grid-template-columns:1fr}\n  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}\n  .kpi{padding:8px}.kpi .v{font-size:16px}\n  .weightbox{grid-template-columns:1fr}\n  .svgwrap{min-height:300px;overflow:auto;-webkit-overflow-scrolling:touch}\n  svg{min-width:650px;min-height:430px}\n  .mobile-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;position:sticky;top:0;z-index:10;background:rgba(14,22,27,.96);backdrop-filter:blur(6px);padding:7px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}\n  .mobile-summary .ms{font-size:10px;color:var(--muted);text-align:center}\n  .mobile-summary .ms b{display:block;color:var(--text);font-size:13px;margin-top:2px}\n  .actions{grid-template-columns:1fr}\n  .tablewrap{font-size:11px} th,td{padding:7px}\n  details{padding:8px}\n  .touchbar{display:grid;grid-template-columns:1fr 1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0c1418;border-top:1px solid var(--line);padding:8px;gap:6px}\n  .touchbar button{min-height:48px;font-size:13px}\n}\n@media(max-width:380px){.kpis{grid-template-columns:1fr}.mobile-summary{grid-template-columns:1fr}}\n\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Projetista Paramétrico de Esquadros CNC<\/h1>\n  <div class=\"sub\">\n    Dimensionamento visual para <b>esquadro em L<\/b> e <b>esquadro rápido / rafter square<\/b>.\n    Atualização em tempo real, cotas SVG, massa aproximada, heurística de espessura e furação.\n    As sugestões mecânicas são de pré-dimensionamento de oficina; a precisão final depende de usinagem,\n    alívio de tensões, acabamento e verificação metrológica.\n  <\/div>\n<\/header>\n\n<div class=\"tabs\">\n  <button class=\"tab active\" data-page=\"normal\">Esquadro em L<\/button>\n  <button class=\"tab\" data-page=\"speed\">Esquadro rápido<\/button>\n  <button class=\"tab\" data-page=\"criteria\">Critérios e fontes<\/button>\n<\/div>\n\n<section id=\"normal\" class=\"page active\">\n<div class=\"grid\">\n  <div class=\"card controls\">\n    <h2>Parâmetros<\/h2>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Qual lado você está informando?<\/label>\n        <select id=\"nInputSide\">\n          <option value=\"short\">Lado menor<\/option>\n          <option value=\"long\">Lado maior<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>Medida informada (mm)<\/label>\n        <input id=\"nInputLen\" type=\"number\" min=\"100\" max=\"3000\" step=\"1\" value=\"500\">\n      <\/div>\n    <\/div>\n\n    <div class=\"field\">\n      <label>Proporção lado menor : lado maior<\/label>\n      <select id=\"nRatio\">\n        <option value=\"1.5\">1 : 1,5<\/option>\n        <option value=\"2\">1 : 2<\/option>\n        <option value=\"1.5\">2 : 3 (equivale a 1 : 1,5)<\/option>\n      <\/select>\n      <div class=\"mini\">Observação: 1:1,5 e 2:3 descrevem exatamente a mesma geometria.<\/div>\n    <\/div>\n\n    <div class=\"field\">\n      <label>Largura dos braços: <b id=\"nWidthPctTxt\">10,0%<\/b> do lado menor<\/label>\n      <input id=\"nWidthPct\" type=\"range\" min=\"8\" max=\"12\" step=\"0.1\" value=\"10\">\n    <\/div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Material<\/label>\n        <select id=\"nMaterial\">\n          <option value=\"7075\">Alumínio 7075-T6/T651<\/option>\n          <option value=\"6061\">Alumínio 6061-T6<\/option>\n          <option value=\"304\">Inox 304<\/option>\n          <option value=\"316\">Inox 316<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>Nível de robustez<\/label>\n        <select id=\"nRobust\">\n          <option value=\"0.8\">Leve / uso cuidadoso<\/option>\n          <option value=\"1\" selected>Oficina robusto<\/option>\n          <option value=\"1.2\">Impacto severo<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Tipo de furação<\/label>\n        <select id=\"nHoleMode\">\n          <option value=\"functional\">Fixação / traçagem<\/option>\n          <option value=\"relief\">Alívio leve<\/option>\n          <option value=\"none\">Sem furos<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>Espessura<\/label>\n        <select id=\"nThicknessMode\">\n          <option value=\"auto\">Automática recomendada<\/option>\n          <option value=\"manual\">Manual<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"field\" id=\"nManualThkWrap\" style=\"display:none\">\n      <label>Espessura manual (mm)<\/label>\n      <input id=\"nManualThk\" type=\"number\" min=\"2\" max=\"50\" step=\"0.5\" value=\"10\">\n    <\/div>\n\n    <div id=\"nAlerts\"><\/div>\n\n    <div class=\"actions\">\n      <button id=\"nSaveSvg\">Salvar SVG<\/button>\n      <button id=\"nSaveJson\">Salvar JSON<\/button>\n      <button onclick=\"window.print()\">Imprimir<\/button>\n    <\/div>\n  <\/div>\n\n  <div>\n    <div class=\"mobile-summary\" id=\"nMobileSummary\">\n      <div class=\"ms\">Menor<b id=\"nMSShort\">–<\/b><\/div>\n      <div class=\"ms\">Maior<b id=\"nMSLong\">–<\/b><\/div>\n      <div class=\"ms\">Peso<b id=\"nMSMass\">–<\/b><\/div>\n    <\/div>\n    <div class=\"kpis\">\n      <div class=\"kpi\"><div class=\"v\" id=\"nKShort\">–<\/div><div class=\"l\">lado menor<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"nKLong\">–<\/div><div class=\"l\">lado maior<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"nKWidth\">–<\/div><div class=\"l\">largura do braço<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"nKThk\">–<\/div><div class=\"l\">espessura<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"nKHoles\">–<\/div><div class=\"l\">furos<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"nKMass\">–<\/div><div class=\"l\">massa aprox.<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"nKE\">–<\/div><div class=\"l\">módulo E<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"nKY\">–<\/div><div class=\"l\">escoamento<\/div><\/div>\n    <\/div>\n    <div class=\"weightbox\">\n      <div class=\"weightitem\"><div class=\"v\" id=\"nKGrossMass\">–<\/div><div class=\"l\">peso bruto sem furos<\/div><\/div>\n      <div class=\"weightitem\"><div class=\"v\" id=\"nKNetMass\">–<\/div><div class=\"l\">peso estimado final<\/div><\/div>\n      <div class=\"weightitem\"><div class=\"v\" id=\"nKWeightReduction\">–<\/div><div class=\"l\">redução por furos/vazados<\/div><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h3>Desenho paramétrico<\/h3>\n      <div class=\"svgwrap\"><svg id=\"nSvg\" viewBox=\"0 0 900 620\"><\/svg><\/div>\n      <div class=\"legend\">\n        <span><span class=\"dot\" style=\"background:#2d7d8e\"><\/span>material<\/span>\n        <span><span class=\"dot\" style=\"background:#df8f35\"><\/span>furação<\/span>\n        <span><span class=\"dot\" style=\"background:#3d7dcc\"><\/span>cotas<\/span>\n      <\/div>\n      <div class=\"note\" id=\"nSummary\"><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/section>\n\n<section id=\"speed\" class=\"page\">\n<div class=\"grid\">\n  <div class=\"card controls\">\n    <h2>Esquadro rápido<\/h2>\n    <div class=\"field\">\n      <label>Cateto nominal (mm)<\/label>\n      <input id=\"sSize\" type=\"number\" min=\"120\" max=\"600\" step=\"1\" value=\"250\">\n    <\/div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Material<\/label>\n        <select id=\"sMaterial\">\n          <option value=\"7075\">Alumínio 7075-T6/T651<\/option>\n          <option value=\"6061\">Alumínio 6061-T6<\/option>\n          <option value=\"304\">Inox 304<\/option>\n          <option value=\"316\">Inox 316<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>Corpo<\/label>\n        <select id=\"sBody\">\n          <option value=\"frame\">Vazado estrutural<\/option>\n          <option value=\"solid\">Sólido<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"field\">\n      <label>Largura estrutural: <b id=\"sFramePctTxt\">14%<\/b> do cateto<\/label>\n      <input id=\"sFramePct\" type=\"range\" min=\"10\" max=\"20\" step=\"0.5\" value=\"14\">\n    <\/div>\n\n    <div class=\"field\">\n      <label>Aba-guia / fence: <b id=\"sFencePctTxt\">9%<\/b> do cateto<\/label>\n      <input id=\"sFencePct\" type=\"range\" min=\"6\" max=\"14\" step=\"0.5\" value=\"9\">\n    <\/div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Nível de robustez<\/label>\n        <select id=\"sRobust\">\n          <option value=\"0.8\">Leve<\/option>\n          <option value=\"1\" selected>Oficina robusto<\/option>\n          <option value=\"1.2\">Impacto severo<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>Marcas de traçagem<\/label>\n        <select id=\"sScribe\">\n          <option value=\"5\">a cada 5 mm<\/option>\n          <option value=\"10\">a cada 10 mm<\/option>\n          <option value=\"0\">sem marcas<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"inline field\">\n      <input type=\"checkbox\" id=\"sShowPitch\" checked>\n      <label for=\"sShowPitch\" style=\"margin:0\">Mostrar escala geométrica de inclinação 1/12 a 12/12<\/label>\n    <\/div>\n\n    <div id=\"sAlerts\"><\/div>\n\n    <div class=\"actions\">\n      <button id=\"sSaveSvg\">Salvar SVG<\/button>\n      <button id=\"sSaveJson\">Salvar JSON<\/button>\n      <button onclick=\"window.print()\">Imprimir<\/button>\n    <\/div>\n  <\/div>\n\n  <div>\n    <div class=\"mobile-summary\" id=\"sMobileSummary\">\n      <div class=\"ms\">Cateto<b id=\"sMSCat\">–<\/b><\/div>\n      <div class=\"ms\">Espessura<b id=\"sMSThk\">–<\/b><\/div>\n      <div class=\"ms\">Peso<b id=\"sMSMass\">–<\/b><\/div>\n    <\/div>\n    <div class=\"kpis\">\n      <div class=\"kpi\"><div class=\"v\" id=\"sKCat\">–<\/div><div class=\"l\">catetos<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"sKHyp\">–<\/div><div class=\"l\">hipotenusa<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\">45°<\/div><div class=\"l\">ângulo de meia-esquadria<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"sKThk\">–<\/div><div class=\"l\">espessura sugerida<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"sKFrame\">–<\/div><div class=\"l\">largura estrutural<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"sKFence\">–<\/div><div class=\"l\">aba-guia<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\" id=\"sKMass\">–<\/div><div class=\"l\">massa aprox.<\/div><\/div>\n      <div class=\"kpi\"><div class=\"v\">90°<\/div><div class=\"l\">ângulo principal<\/div><\/div>\n    <\/div>\n    <div class=\"weightbox\">\n      <div class=\"weightitem\"><div class=\"v\" id=\"sKGrossMass\">–<\/div><div class=\"l\">peso bruto triangular<\/div><\/div>\n      <div class=\"weightitem\"><div class=\"v\" id=\"sKNetMass\">–<\/div><div class=\"l\">peso estimado final<\/div><\/div>\n      <div class=\"weightitem\"><div class=\"v\" id=\"sKWeightReduction\">–<\/div><div class=\"l\">redução por vazado<\/div><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h3>Geometria do esquadro rápido<\/h3>\n      <div class=\"svgwrap\"><svg id=\"sSvg\" viewBox=\"0 0 900 650\"><\/svg><\/div>\n      <div class=\"note\" id=\"sSummary\"><\/div>\n    <\/div>\n\n    <div class=\"card\" style=\"margin-top:12px\">\n      <h3>Tabela de caibro comum — geometria pura<\/h3>\n      <div class=\"note\">Para uma inclinação <b>r/12<\/b>: ângulo = atan(r/12) e fator de comprimento = √(12²+r²)/12. Não depende de tabela proprietária.<\/div>\n      <div class=\"tablewrap\"><table id=\"pitchTable\"><thead><tr><th>Inclinação<\/th><th>Ângulo<\/th><th>Fator de comprimento<\/th><th>%<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/section>\n\n<section id=\"criteria\" class=\"page\">\n<div class=\"card\" style=\"max-width:1100px;margin:auto\">\n<h2>Critérios de engenharia e fontes<\/h2>\n\n<p class=\"note\"><span class=\"badge\">Pesquisa: 28/09/2026<\/span><\/p>\n\n<h3>1. Proporções<\/h3>\n<p class=\"note\">\nNão existe uma única proporção universal que determine todos os esquadros de oficina. O configurador oferece as proporções solicitadas:\n<b>1:1,5<\/b>, <b>1:2<\/b> e <b>2:3<\/b>. Matematicamente, 1:1,5 = 2:3.\nA escolha é funcional e ergonômica; a precisão de 90° é uma propriedade metrológica separada.\n<\/p>\n\n<h3>2. Largura dos braços<\/h3>\n<p class=\"note\">\nA faixa de 8% a 12% do lado menor é tratada aqui como <b>regra de projeto parametrizável<\/b>, não como exigência DIN/ISO.\nQuanto maior a largura, maior a resistência à flexão no plano e maior a área de referência, porém cresce massa e custo.\n<\/p>\n\n<h3>3. Espessura recomendada<\/h3>\n<p class=\"note\">\nO modo automático usa o 7075-T6 como referência e combina dois critérios de equivalência:\n<b>rigidez à flexão<\/b>, proporcional a E·t³, e <b>resistência ao início de deformação plástica em flexão<\/b>, aproximadamente proporcional a σ<sub>y<\/sub>·t².\nPara o perfil “oficina robusto”, a espessura-base do 7075 varia aproximadamente com o tamanho e é limitada a uma faixa prática.\nNos demais materiais, a ferramenta corrige a espessura usando E e σ<sub>y<\/sub>, depois arredonda para uma espessura comercial comum.\nIsso é uma <b>heurística conservadora de pré-dimensionamento<\/b>, não uma norma de impacto.\n<\/p>\n\n<h3>4. Furação<\/h3>\n<p class=\"note\">\nO algoritmo mantém uma zona sem furos próxima ao vértice de 90°, usa afastamento de borda e espaçamento relacionados ao diâmetro e à largura do braço.\n“Fixação/traçagem” usa furos pequenos; “alívio leve” usa diâmetro maior, mas não substitui análise estrutural de grandes vazados.\nSuperfícies metrológicas externas e internas devem permanecer contínuas.\n<\/p>\n\n<h3>5. Precisão metrológica<\/h3>\n<p class=\"note\">\nA DIN 875 trata de esquadros de 90°. A página oficial da DIN Media indica que a antiga DIN 875:1981 foi substituída pela DIN 875-1:2005\ne que a parte 1, para esquadros de aço, foi posteriormente retirada. A DIN 875-2:2008 para esquadros de granito aparece como vigente.\nPor isso este configurador <b>não declara conformidade automática com uma classe DIN<\/b>. A peça pronta deve ser verificada contra padrão adequado,\nidealmente em superfície de granito, e as faces de referência devem receber acabamento de precisão.\n<\/p>\n\n<h3>6. Esquadro rápido / rafter square<\/h3>\n<p class=\"note\">\nA geometria-base é um triângulo retângulo isósceles: dois catetos iguais, 90° no vértice e hipotenusa a 45°.\nO modo rápido inclui escala angular e uma escala matemática de inclinação de telhado r/12, calculada por atan(r/12).\nA Swanson documenta oficialmente o uso do pivot, escala de graus e do “rise per 12 inches of run” para caibros comuns.\nO configurador não copia tabelas proprietárias: calcula os valores diretamente pela trigonometria.\n<\/p>\n\n\n<h3>7. Estimativa de peso<\/h3>\n<p class=\"note\">\nO peso é calculado por <b>massa = área plana × espessura × densidade<\/b>.\nNo esquadro em L, o cálculo desconta a área dos furos. No esquadro rápido vazado,\ndesconta o vazio triangular interno. A aba-guia do esquadro rápido é tratada como aproximação geométrica,\nporque sua massa real depende de como ela será fabricada (degrau usinado, dobra ou peça separada).\n<\/p>\n\n<h3>Propriedades usadas no cálculo<\/h3>\n<div class=\"tablewrap\">\n<table>\n<thead><tr><th>Material<\/th><th>Densidade g/cm³<\/th><th>E GPa<\/th><th>σy MPa<\/th><th>Observação<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Al 7075-T6/T651<\/td><td>2,81<\/td><td>71,7<\/td><td>503<\/td><td>Referência de alta resistência<\/td><\/tr>\n<tr><td>Al 6061-T6<\/td><td>2,70<\/td><td>68,9<\/td><td>276<\/td><td>Mais macio; marca com mais facilidade<\/td><\/tr>\n<tr><td>Inox 304<\/td><td>8,00<\/td><td>193<\/td><td>230<\/td><td>Valor mínimo/típico de chapa recozida<\/td><\/tr>\n<tr><td>Inox 316<\/td><td>8,00<\/td><td>193<\/td><td>205<\/td><td>Valor mínimo de material recozido<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n\n<h3 style=\"margin-top:16px\">Fontes consultadas<\/h3>\n<div class=\"note\">\n<ul>\n<li><a href=\"https://www.dinmedia.de/en/standard/din-875-1/80823018\" target=\"_blank\">DIN Media — DIN 875-1:2005-07, Squares 90°, steel<\/a><\/li>\n<li><a href=\"https://www.dinmedia.de/en/standard/din-875-2/101892278\" target=\"_blank\">DIN Media — DIN 875-2:2008-01, granite squares<\/a><\/li>\n<li><a href=\"https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA7075T6&lang=en\" target=\"_blank\">MatWeb/ASM — Aluminum 7075-T6<\/a><\/li>\n<li><a href=\"https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6\" target=\"_blank\">MatWeb/ASM — Aluminum 6061-T6<\/a><\/li>\n<li><a href=\"https://www.azom.com/article.aspx?ArticleID=2867\" target=\"_blank\">AZoM — Stainless 304 properties<\/a><\/li>\n<li><a href=\"https://www.azom.com/article.aspx?articleid=863\" target=\"_blank\">AZoM — Stainless 316 properties<\/a><\/li>\n<li><a href=\"https://www.swansontoolco.com/resources/blue-book/pro/cutting-a-common-rafter\" target=\"_blank\">Swanson Tool — common rafter / Speed Square<\/a><\/li>\n<li><a href=\"https://www.swansontoolco.com/shop/metric-speed-square-eu202\" target=\"_blank\">Swanson Tool — Metric Speed Square<\/a><\/li>\n<\/ul>\n<\/div>\n\n<div class=\"alert warn\">\n<b>Importante:<\/b> queda, impacto localizado e esmagamento por ferramenta são eventos dinâmicos e dependem da forma do impacto, apoio, raio de quina,\ntratamento e condição real do material. A espessura “ideal” aqui é uma recomendação paramétrica para projeto; não é garantia de sobrevivência a qualquer queda.\n<\/div>\n<\/div>\n<\/section>\n\n<script>\nconst NS=\"http://www.w3.org/2000/svg\";\n\nconst MAT={\n  \"7075\":{name:\"Alumínio 7075-T6/T651\",rho:2.81,E:71.7,y:503,hard:\"alta\"},\n  \"6061\":{name:\"Alumínio 6061-T6\",rho:2.70,E:68.9,y:276,hard:\"média\"},\n  \"304\":{name:\"Inox 304\",rho:8.00,E:193,y:230,hard:\"média/alta\"},\n  \"316\":{name:\"Inox 316\",rho:8.00,E:193,y:205,hard:\"média/alta\"}\n};\nconst STOCK=[3,4,5,6,8,10,12,15,16,20,25,30];\n\nfunction clamp(x,a,b){return Math.min(b,Math.max(a,x))}\nfunction roundStock(x){for(const s of STOCK) if(s>=x) return s; return Math.ceil(x/5)*5}\nfunction fmt(x,d=0){return Number(x).toLocaleString(\"pt-BR\",{minimumFractionDigits:d,maximumFractionDigits:d})}\nfunction el(id){return document.getElementById(id)}\nfunction svgEl(tag,attrs={},text=\"\"){\n  const e=document.createElementNS(NS,tag);\n  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));\n  if(text)e.textContent=text;\n  return e\n}\nfunction download(name,type,text){\n  const a=document.createElement(\"a\");\n  a.href=URL.createObjectURL(new Blob([text],{type}));\n  a.download=name;document.body.appendChild(a);a.click();\n  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},200)\n}\nfunction exportSvg(svg,name){\n  const clone=svg.cloneNode(true);\n  clone.setAttribute(\"xmlns\",NS);\n  download(name,\"image/svg+xml;charset=utf-8\",new XMLSerializer().serializeToString(clone))\n}\nfunction addDefs(svg){\n  const defs=svgEl(\"defs\");\n  const marker=svgEl(\"marker\",{id:\"arrow\",markerWidth:\"8\",markerHeight:\"8\",refX:\"4\",refY:\"4\",orient:\"auto-start-reverse\",markerUnits:\"strokeWidth\"});\n  marker.appendChild(svgEl(\"path\",{d:\"M0,0 L8,4 L0,8 Z\",fill:\"#3d7dcc\"}));\n  defs.appendChild(marker);svg.appendChild(defs)\n}\nfunction addDim(svg,x1,y1,x2,y2,label,tx,ty,rotate=0){\n  svg.appendChild(svgEl(\"line\",{x1,y1,x2,y2,stroke:\"#3d7dcc\",\"stroke-width\":\"1.5\",\"marker-start\":\"url(#arrow)\",\"marker-end\":\"url(#arrow)\"}));\n  const t=svgEl(\"text\",{x:tx,y:ty,fill:\"#174f97\",\"font-size\":\"16\",\"font-weight\":\"700\",\"text-anchor\":\"middle\"},label);\n  if(rotate)t.setAttribute(\"transform\",`rotate(${rotate} ${tx} ${ty})`);\n  svg.appendChild(t)\n}\n\nfunction baseThickness7075(L,kind=\"normal\"){\n  if(kind===\"speed\") return clamp(L/45,5,10);\n  return clamp(L/60,6,16);\n}\nfunction suggestedThickness(L,matKey,robust=1,kind=\"normal\"){\n  const m=MAT[matKey],ref=MAT[\"7075\"];\n  const tr=baseThickness7075(L,kind)*robust;\n  const tStiff=tr*Math.cbrt(ref.E/m.E);             // E*t^3 equivalence\n  const tYield=0.75*tr*Math.sqrt(ref.y/m.y);        // conservative partial plastic-bending equivalence\n  return {raw:Math.max(tStiff,tYield,kind===\"speed\"?4:5),stock:roundStock(Math.max(tStiff,tYield,kind===\"speed\"?4:5)),tStiff,tYield,tr}\n}\n\n/* ---------- Normal square ---------- */\nfunction calcNormal(){\n  const inputLen=Math.max(1,+el(\"nInputLen\").value||500);\n  const ratio=+el(\"nRatio\").value;\n  let short=inputLen,long=inputLen*ratio;\n  if(el(\"nInputSide\").value===\"long\"){long=inputLen;short=inputLen/ratio}\n  const wp=+el(\"nWidthPct\").value;\n  const w=short*wp/100;\n  const matKey=el(\"nMaterial\").value, m=MAT[matKey];\n  const robust=+el(\"nRobust\").value;\n  const th=suggestedThickness(short,matKey,robust,\"normal\");\n  const t=el(\"nThicknessMode\").value===\"manual\" ? Math.max(2,+el(\"nManualThk\").value||th.stock) : th.stock;\n\n  const holeMode=el(\"nHoleMode\").value;\n  let d=0,pitch=0,cornerKeep=0,endKeep=0;\n  if(holeMode===\"functional\"){\n    d=clamp(w*0.18,6,14); pitch=Math.max(2.5*w,4*d,100); cornerKeep=Math.max(1.25*w,3*d);endKeep=Math.max(.8*w,3*d);\n  }else if(holeMode===\"relief\"){\n    d=clamp(w*0.45,12,40); pitch=Math.max(1.85*w,3*d); cornerKeep=Math.max(1.6*w,3.5*d);endKeep=Math.max(w,3*d);\n  }\n  function positions(L){\n    if(holeMode===\"none\")return [];\n    const usable=L-cornerKeep-endKeep;\n    if(usable<=0)return [];\n    const n=Math.max(1,Math.floor(usable/pitch)+1);\n    if(n===1)return [cornerKeep+usable/2];\n    return Array.from({length:n},(_,i)=>cornerKeep+i*usable/(n-1))\n  }\n  const hx=positions(long), hy=positions(short);\n  const areaGross=long*w+short*w-w*w;\n  const areaHoles=(hx.length+hy.length)*Math.PI*d*d/4;\n  const area=Math.max(0,areaGross-areaHoles);\n  const grossMass=areaGross*t*m.rho/1e6;\n  const mass=area*t*m.rho/1e6;\n  const weightReduction=grossMass>0 ? (grossMass-mass)/grossMass*100 : 0;\n\n  return {short,long,w,wp,matKey,m,robust,th,t,holeMode,d,hx,hy,mass,grossMass,weightReduction,areaGross,areaHoles}\n}\n\nfunction drawNormal(o){\n  const svg=el(\"nSvg\");svg.innerHTML=\"\";addDefs(svg);\n  const pad=95,W=900,H=620;\n  const sx=(W-2*pad)/o.long, sy=(H-2*pad)/o.short, s=Math.min(sx,sy);\n  const ox=pad, oy=pad;\n  const L=o.long*s,S=o.short*s,w=o.w*s;\n  // L-shape\n  const d=`M ${ox} ${oy} L ${ox+L} ${oy} L ${ox+L} ${oy+w} L ${ox+w} ${oy+w} L ${ox+w} ${oy+S} L ${ox} ${oy+S} Z`;\n  svg.appendChild(svgEl(\"path\",{d,fill:\"#2d7d8e\",stroke:\"#0b4854\",\"stroke-width\":\"2\"}));\n  // inner reference outline\n  svg.appendChild(svgEl(\"path\",{d:`M ${ox+w} ${oy+w} L ${ox+L} ${oy+w} M ${ox+w} ${oy+w} L ${ox+w} ${oy+S}`,fill:\"none\",stroke:\"#093d49\",\"stroke-width\":\"2\"}));\n\n  if(o.holeMode!==\"none\"){\n    o.hx.forEach(x=>svg.appendChild(svgEl(\"circle\",{cx:ox+x*s,cy:oy+w/2,r:o.d*s/2,fill:\"#f8fbfc\",stroke:\"#df8f35\",\"stroke-width\":\"2\"})));\n    o.hy.forEach(y=>svg.appendChild(svgEl(\"circle\",{cx:ox+w/2,cy:oy+y*s,r:o.d*s/2,fill:\"#f8fbfc\",stroke:\"#df8f35\",\"stroke-width\":\"2\"})));\n  }\n\n  // 90° mark\n  const q=Math.min(28,w*.5);\n  svg.appendChild(svgEl(\"path\",{d:`M ${ox+w+6} ${oy+w+q} L ${ox+w+q} ${oy+w+q} L ${ox+w+q} ${oy+w+6}`,fill:\"none\",stroke:\"#f0a34a\",\"stroke-width\":\"2\"}));\n\n  addDim(svg,ox,oy-35,ox+L,oy-35,`${fmt(o.long)} mm`,ox+L/2,oy-47);\n  addDim(svg,ox-35,oy,ox-35,oy+S,`${fmt(o.short)} mm`,ox-51,oy+S/2,-90);\n  addDim(svg,ox+L*.72,oy+4,ox+L*.72,oy+w-4,`${fmt(o.w,1)} mm`,ox+L*.72+47,oy+w/2+5);\n\n  svg.appendChild(svgEl(\"text\",{x:W-18,y:H-18,fill:\"#50666e\",\"font-size\":\"14\",\"text-anchor\":\"end\"},`${o.m.name} • t=${fmt(o.t,1)} mm`));\n}\n\nfunction updateNormal(){\n  el(\"nWidthPctTxt\").textContent=fmt(+el(\"nWidthPct\").value,1)+\"%\";\n  el(\"nManualThkWrap\").style.display=el(\"nThicknessMode\").value===\"manual\"?\"block\":\"none\";\n  const o=calcNormal();\n  el(\"nKShort\").textContent=fmt(o.short)+\" mm\";\n  el(\"nKLong\").textContent=fmt(o.long)+\" mm\";\n  el(\"nKWidth\").textContent=fmt(o.w,1)+\" mm\";\n  el(\"nKThk\").textContent=fmt(o.t,1)+\" mm\";\n  el(\"nKHoles\").textContent=(o.hx.length+o.hy.length)+(o.holeMode===\"none\"?\"\":\" × Ø\"+fmt(o.d,1));\n  el(\"nKMass\").textContent=fmt(o.mass,2)+\" kg\";\n  el(\"nKGrossMass\").textContent=fmt(o.grossMass,2)+\" kg\";\n  el(\"nKNetMass\").textContent=fmt(o.mass,2)+\" kg\";\n  el(\"nKWeightReduction\").textContent=fmt(o.weightReduction,1)+\"%\";\n  el(\"nMSShort\").textContent=fmt(o.short)+\" mm\";\n  el(\"nMSLong\").textContent=fmt(o.long)+\" mm\";\n  el(\"nMSMass\").textContent=fmt(o.mass,2)+\" kg\";\n  el(\"nKE\").textContent=fmt(o.m.E,1)+\" GPa\";\n  el(\"nKY\").textContent=fmt(o.m.y)+\" MPa\";\n\n  const alerts=[];\n  if(o.wp<=8.5)alerts.push([\"warn\",\"Braço estreito: 8–8,5% reduz massa, mas deixa menos seção para resistir a impacto e menos superfície de referência.\"]);\n  if(o.short>1000)alerts.push([\"warn\",\"Esquadro muito grande: acima de 1.000 mm, empeno residual, temperatura e qualidade da usinagem passam a dominar a precisão.\"]);\n  if(o.matKey===\"6061\")alerts.push([\"warn\",\"6061-T6 é fácil de usinar, porém é bem menos resistente a marcação/deformação local que 7075-T6.\"]);\n  if((o.matKey===\"304\"||o.matKey===\"316\")&&o.mass>5)alerts.push([\"warn\",\"Em inox a massa cresce rapidamente. Avalie ergonomia e a energia de impacto da própria ferramenta ao cair.\"]);\n  if(o.holeMode===\"relief\")alerts.push([\"warn\",\"Furos de alívio são uma heurística de massa. Para vazados grandes ou peça crítica, faça análise estrutural/FEA antes da fabricação.\"]);\n  if(!alerts.length)alerts.push([\"good\",\"Geometria dentro da faixa paramétrica prevista pelo configurador.\"]);\n  el(\"nAlerts\").innerHTML=alerts.map(a=>`<div class=\"alert ${a[0]}\">${a[1]}<\/div>`).join(\"\");\n\n  el(\"nSummary\").innerHTML=`Proporção efetiva <b>1:${fmt(o.long/o.short,2)}<\/b>. Espessura automática bruta calculada: <b>${fmt(o.th.raw,2)} mm<\/b>; arredondada para chapa comercial: <b>${fmt(o.th.stock,1)} mm<\/b>. Peso bruto estimado: <b>${fmt(o.grossMass,2)} kg<\/b>; peso final estimado: <b>${fmt(o.mass,2)} kg<\/b>, já descontando os furos mostrados (${fmt(o.weightReduction,1)}% de redução).`;\n  drawNormal(o);saveState()\n}\n\n/* ---------- Speed square ---------- */\nfunction calcSpeed(){\n  const A=Math.max(80,+el(\"sSize\").value||250);\n  const matKey=el(\"sMaterial\").value,m=MAT[matKey];\n  const robust=+el(\"sRobust\").value;\n  const th=suggestedThickness(A,matKey,robust,\"speed\");\n  const t=th.stock;\n  const fp=+el(\"sFramePct\").value,w=A*fp/100;\n  const fence=A*(+el(\"sFencePct\").value)/100;\n  const body=el(\"sBody\").value;\n  const outer=A*A/2;\n  const innerLeg=Math.max(0,A-w*(2+Math.SQRT2));\n  const inner=body===\"frame\"?innerLeg*innerLeg/2:0;\n  let area=outer-inner;\n  // fence modeled as plan-view extra strip; actual 3D mass depends machining\n  const fenceArea=A*fence*0.35;\n  area+=fenceArea;\n  const grossArea=outer+fenceArea;\n  const grossMass=grossArea*t*m.rho/1e6;\n  const mass=area*t*m.rho/1e6;\n  const weightReduction=grossMass>0 ? (grossMass-mass)/grossMass*100 : 0;\n  return {A,hyp:A*Math.SQRT2,matKey,m,robust,th,t,fp,w,fence,body,innerLeg,mass,grossMass,weightReduction}\n}\nfunction polar(cx,cy,r,deg){\n  const a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy-r*Math.sin(a)]\n}\nfunction drawSpeed(o){\n  const svg=el(\"sSvg\");svg.innerHTML=\"\";addDefs(svg);\n  const W=900,H=650,pad=85;\n  const s=Math.min((W-2*pad)/o.A,(H-2*pad)/o.A);\n  const A=o.A*s,ox=pad,oy=H-pad; // right angle at bottom-left\n  const p0=[ox,oy],p1=[ox+A,oy],p2=[ox,oy-A];\n  svg.appendChild(svgEl(\"path\",{d:`M ${p0[0]} ${p0[1]} L ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} Z`,fill:\"#2d7d8e\",stroke:\"#0b4854\",\"stroke-width\":\"2\"}));\n\n  if(o.body===\"frame\" && o.innerLeg>0){\n    const w=o.w*s;\n    // offset triangle: x>=w, y from bottom negative; x + verticalHeight <= A - w*sqrt(2)\n    const q0=[ox+w,oy-w], q1=[ox+(o.A-o.w*(1+Math.SQRT2))*s,oy-w], q2=[ox+w,oy-(o.A-o.w*(1+Math.SQRT2))*s];\n    svg.appendChild(svgEl(\"path\",{d:`M ${q0[0]} ${q0[1]} L ${q1[0]} ${q1[1]} L ${q2[0]} ${q2[1]} Z`,fill:\"#f8fbfc\",stroke:\"#0b4854\",\"stroke-width\":\"1.5\"}));\n  }\n\n  // fence indication\n  const fw=Math.min(o.fence*s,35);\n  svg.appendChild(svgEl(\"rect\",{x:ox-fw,y:oy-A,width:fw,height:A,fill:\"#75aeb8\",stroke:\"#0b4854\",\"stroke-width\":\"1.5\"}));\n  svg.appendChild(svgEl(\"text\",{x:ox-fw/2,y:oy-A/2,fill:\"#173c44\",\"font-size\":\"12\",\"text-anchor\":\"middle\",transform:`rotate(-90 ${ox-fw/2} ${oy-A/2})`},\"ABA-GUIA\"));\n\n  // scribe marks on horizontal leg\n  const step=+el(\"sScribe\").value;\n  if(step>0){\n    for(let mm=step;mm<o.A;mm+=step){\n      const x=ox+mm*s, len=(mm%(step*5)===0)?13:7;\n      svg.appendChild(svgEl(\"line\",{x1:x,y1:oy,x2:x,y2:oy-len,stroke:\"#e7f4f6\",\"stroke-width\":\"1\"}));\n    }\n  }\n\n  // degree scale, generic geometric\n  const rc=Math.min(A*.48,250), cx=ox,cy=oy;\n  for(let deg=5;deg<=85;deg+=5){\n    const r1=rc-(deg%15===0?16:9),r2=rc;\n    const a=polar(cx,cy,r1,deg),b=polar(cx,cy,r2,deg);\n    svg.appendChild(svgEl(\"line\",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:\"#f7dfbd\",\"stroke-width\":deg%15===0?2:1}));\n    if(deg%15===0){\n      const t=polar(cx,cy,rc-30,deg);\n      svg.appendChild(svgEl(\"text\",{x:t[0],y:t[1]+4,fill:\"#73470f\",\"font-size\":\"12\",\"text-anchor\":\"middle\"},deg+\"°\"));\n    }\n  }\n\n  // pitch markers 1/12...12/12\n  if(el(\"sShowPitch\").checked){\n    const rPitch=rc-52;\n    for(let rise=1;rise<=12;rise++){\n      const deg=Math.atan(rise/12)*180/Math.PI;\n      const p=polar(cx,cy,rPitch,deg);\n      svg.appendChild(svgEl(\"circle\",{cx:p[0],cy:p[1],r:2.5,fill:\"#df8f35\"}));\n      if([2,4,6,8,10,12].includes(rise)){\n        const q=polar(cx,cy,rPitch-18,deg);\n        svg.appendChild(svgEl(\"text\",{x:q[0],y:q[1]+3,fill:\"#8f5514\",\"font-size\":\"10\",\"text-anchor\":\"middle\"},rise+\"/12\"));\n      }\n    }\n  }\n\n  // right angle symbol\n  const q=25;svg.appendChild(svgEl(\"path\",{d:`M ${ox+8} ${oy-q} L ${ox+q} ${oy-q} L ${ox+q} ${oy-8}`,fill:\"none\",stroke:\"#f0a34a\",\"stroke-width\":\"2\"}));\n  addDim(svg,ox,oy+35,ox+A,oy+35,`${fmt(o.A)} mm`,ox+A/2,oy+57);\n  addDim(svg,ox-47,oy,ox-47,oy-A,`${fmt(o.A)} mm`,ox-63,oy-A/2,-90);\n  svg.appendChild(svgEl(\"text\",{x:ox+A*.58,y:oy-A*.55,fill:\"#143f48\",\"font-size\":\"16\",\"font-weight\":\"800\",\"text-anchor\":\"middle\",transform:`rotate(-45 ${ox+A*.58} ${oy-A*.55})`},`hip. ${fmt(o.hyp,1)} mm`));\n  svg.appendChild(svgEl(\"text\",{x:W-18,y:H-18,fill:\"#50666e\",\"font-size\":\"14\",\"text-anchor\":\"end\"},`${o.m.name} • t=${fmt(o.t,1)} mm`));\n}\nfunction fillPitchTable(){\n  const tb=el(\"pitchTable\").querySelector(\"tbody\");tb.innerHTML=\"\";\n  for(let r=1;r<=12;r++){\n    const ang=Math.atan(r/12)*180/Math.PI;\n    const factor=Math.sqrt(144+r*r)/12;\n    const tr=document.createElement(\"tr\");\n    tr.innerHTML=`<td>${r}/12<\/td><td>${fmt(ang,2)}°<\/td><td>${fmt(factor,4)}<\/td
